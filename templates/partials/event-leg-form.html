{{define "content"}}
<style>
    .form-card {
        background-color: var(--bg-surface);
        border: 2px solid var(--accent-primary);
        border-radius: 0.5rem;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
    }

    .form-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--border-color);
    }

    .form-title {
        font-size: 1.125rem;
        font-weight: 700;
        color: var(--accent-primary);
    }

    .close-form-btn {
        background: none;
        border: none;
        color: var(--text-muted);
        font-size: 1.5rem;
        cursor: pointer;
        padding: 0;
        width: 2rem;
        height: 2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 0.25rem;
        transition: all 0.2s ease;
    }

    .close-form-btn:hover {
        background-color: var(--bg-sidebar);
        color: var(--text-primary);
    }

    .form-group {
        margin-bottom: 1.5rem;
    }

    .form-label {
        display: block;
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 0.5rem;
    }

    .form-input,
    .form-textarea {
        width: 100%;
        padding: 0.625rem;
        background-color: var(--bg-sidebar);
        border: 1px solid var(--border-color);
        border-radius: 0.375rem;
        color: var(--text-primary);
        font-size: 0.95rem;
        font-family: inherit;
        transition: all 0.2s ease;
        box-sizing: border-box;
    }

    .form-input:focus,
    .form-textarea:focus {
        outline: none;
        border-color: var(--accent-primary);
        box-shadow: 0 0 8px rgba(59, 130, 246, 0.2);
    }

    .form-textarea {
        resize: vertical;
        min-height: 5rem;
    }

    .form-help-text {
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-top: 0.25rem;
    }

    .form-actions {
        display: flex;
        gap: 0.75rem;
        margin-top: 2rem;
        padding-top: 1rem;
        border-top: 1px solid var(--border-color);
    }

    .form-button {
        padding: 0.625rem 1.5rem;
        border-radius: 0.375rem;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: all 0.2s ease;
    }

    .button-save {
        background-color: var(--accent-primary);
        color: white;
        flex: 1;
    }

    .button-save:hover {
        background-color: #2563eb;
    }

    .button-cancel {
        background-color: var(--bg-sidebar);
        color: var(--text-primary);
        border: 1px solid var(--border-color);
        flex: 0 0 auto;
    }

    .button-cancel:hover {
        background-color: var(--bg-surface);
    }
</style>

<div class="form-card">
    <div class="form-header">
        <h2 class="form-title">{{if .IsEdit}}Edit Leg{{else}}Add New Leg{{end}}</h2>
        <button type="button" class="close-form-btn" onclick="document.getElementById('leg-form-container').style.display = 'none';">
            ✕
        </button>
    </div>

    <form {{if .IsEdit}}
          hx-post="/dashboard/events/{{.EventID}}/legs/{{.ID}}/update"
          {{else}}
          hx-post="/dashboard/events/{{.EventID}}/legs/create"
          {{end}}
          hx-on::after-request="if (event.detail.xhr.status === 200) {
              document.getElementById('leg-form-container').style.display = 'none';
              htmx.trigger('body', 'legCreated');
          }"
          hx-target="#events-container"
          hx-swap="innerHTML"
          hx-indicator="#global-spinner">
        <div class="form-group">
            <label class="form-label" for="origin">Origin (ICAO) *</label>
            <input type="text"
                   id="origin"
                   name="origin"
                   class="form-input"
                   value="{{if .IsEdit}}{{.Origin}}{{end}}"
                   placeholder="e.g., EGLL"
                   required
                   maxlength="4"
                   pattern="[A-Z]{2,4}"
                   style="text-transform: uppercase;">
            <div class="form-help-text">ICAO code of origin airport (2-4 characters)</div>
        </div>

        <div class="form-group">
            <label class="form-label" for="destination">Destination (ICAO) *</label>
            <input type="text"
                   id="destination"
                   name="destination"
                   class="form-input"
                   value="{{if .IsEdit}}{{.Destination}}{{end}}"
                   placeholder="e.g., EHAM"
                   required
                   maxlength="4"
                   pattern="[A-Z]{2,4}"
                   style="text-transform: uppercase;">
            <div class="form-help-text">ICAO code of destination airport (2-4 characters)</div>
        </div>

        <div class="form-group">
            <label class="form-label" for="route_at_id">Route Airtable ID</label>
            <input type="text"
                   id="route_at_id"
                   name="route_at_id"
                   class="form-input"
                   value="{{if .IsEdit}}{{.RouteATID}}{{end}}"
                   placeholder="Optional: Airtable route ID">
            <div class="form-help-text">Optional: Link to Airtable route record</div>
        </div>

        <div class="form-group">
            <label class="form-label" for="description">Description</label>
            <textarea id="description"
                      name="description"
                      class="form-textarea"
                      placeholder="Optional: Brief description of this leg">{{if .IsEdit}}{{.Description}}{{end}}</textarea>
        </div>

        <div class="form-group">
            <label class="form-label" for="thumbnail_url">Thumbnail URL</label>
            <input type="url"
                   id="thumbnail_url"
                   name="thumbnail_url"
                   class="form-input"
                   value="{{if .IsEdit}}{{.ThumbnailURL}}{{end}}"
                   placeholder="Optional: URL to thumbnail image">
            <div class="form-help-text">Optional: URL to a thumbnail image for this leg</div>
        </div>

        <div class="form-actions">
            <button type="submit" class="form-button button-save">Save</button>
            <button type="button" class="form-button button-cancel" onclick="document.getElementById('leg-form-container').style.display = 'none';">
                Cancel
            </button>
        </div>
    </form>
</div>
{{end}}
