{{define "content"}}
<style>
    .form-card {
        background-color: var(--bg-surface);
        border: 2px solid var(--accent-primary);
        border-radius: 0.5rem;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
    }

    .form-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--border-color);
    }

    .form-title {
        font-size: 1.125rem;
        font-weight: 700;
        color: var(--accent-primary);
    }

    .close-form-btn {
        background: none;
        border: none;
        color: var(--text-muted);
        font-size: 1.5rem;
        cursor: pointer;
        padding: 0;
        width: 2rem;
        height: 2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 0.25rem;
        transition: all 0.2s ease;
    }

    .close-form-btn:hover {
        background-color: var(--bg-sidebar);
        color: var(--text-primary);
    }

    .form-group {
        margin-bottom: 1.5rem;
    }

    .form-label {
        display: block;
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 0.5rem;
    }

    .form-input,
    .form-textarea {
        width: 100%;
        padding: 0.625rem;
        background-color: var(--bg-sidebar);
        border: 1px solid var(--border-color);
        border-radius: 0.375rem;
        color: var(--text-primary);
        font-size: 0.95rem;
        font-family: inherit;
        transition: all 0.2s ease;
        box-sizing: border-box;
    }

    .form-input:focus,
    .form-textarea:focus {
        outline: none;
        border-color: var(--accent-primary);
        box-shadow: 0 0 8px rgba(59, 130, 246, 0.2);
    }

    .form-textarea {
        resize: vertical;
        min-height: 5rem;
    }

    .form-help-text {
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-top: 0.25rem;
    }

    .form-actions {
        display: flex;
        gap: 0.75rem;
        margin-top: 2rem;
        padding-top: 1rem;
        border-top: 1px solid var(--border-color);
    }

    .form-button {
        padding: 0.625rem 1.5rem;
        border-radius: 0.375rem;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: all 0.2s ease;
    }

    .button-save {
        background-color: var(--accent-primary);
        color: white;
        flex: 1;
    }

    .button-save:hover {
        background-color: #2563eb;
    }

    .button-cancel {
        background-color: var(--bg-sidebar);
        color: var(--text-primary);
        border: 1px solid var(--border-color);
        flex: 0 0 auto;
    }

    .button-cancel:hover {
        background-color: var(--bg-surface);
    }

    .route-search-container {
        position: relative;
    }

    .route-search-dropdown {
        position: absolute;
        z-index: 1000;
        background-color: var(--bg-surface);
        border: 1px solid var(--border-color);
        border-radius: 0.375rem;
        margin-top: 0.25rem;
        max-height: 300px;
        overflow-y: auto;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        width: 100%;
    }

    .route-search-item {
        padding: 0.75rem;
        cursor: pointer;
        border-bottom: 1px solid var(--border-color);
        transition: background-color 0.2s;
    }

    .route-search-item:hover {
        background-color: var(--bg-sidebar);
    }

    .route-search-item:last-child {
        border-bottom: none;
    }
</style>

<script>
function selectRoute(atid, route, origin, destination) {
    event.stopPropagation();
    event.preventDefault();
    document.getElementById('route_at_id').value = atid;
    const displayText = route + (origin || destination ? ' (' + (origin || '?') + '-' + (destination || '?') + ')' : '');
    document.getElementById('route_search_display').value = displayText;
    document.getElementById('route-search-dropdown').innerHTML = '';
    document.getElementById('route_search_display').style.display = 'block';
    document.getElementById('route_search_input').style.display = 'none';
    document.getElementById('route_search_input').value = '';
    return false;
}
</script>

<div class="form-card" onclick="event.stopPropagation();">
    <div class="form-header">
        <h2 class="form-title">{{if .IsEdit}}Edit Leg{{else}}Add New Leg{{end}}</h2>
        <button type="button" class="close-form-btn" onclick="event.stopPropagation(); document.getElementById('leg-form-container').style.display = 'none';">
            ✕
        </button>
    </div>

    <form {{if .IsEdit}}
          hx-post="/dashboard/events/{{.EventID}}/legs/{{.ID}}/update"
          {{else}}
          hx-post="/dashboard/events/{{.EventID}}/legs/create"
          {{end}}
          hx-on::after-request="if (event.detail.xhr.status === 200 && event.detail.target.id === 'events-container') {
              document.getElementById('leg-form-container').style.display = 'none';
              htmx.trigger('body', 'legCreated');
          }"
          hx-target="#events-container"
          hx-swap="innerHTML"
          hx-indicator="#global-spinner"
          onclick="event.stopPropagation();"
          onsubmit="event.stopPropagation();">
        <div class="form-group">
            <label class="form-label" for="origin">Origin (ICAO) *</label>
            <input type="text"
                   id="origin"
                   name="origin"
                   class="form-input"
                   value="{{if .IsEdit}}{{.Origin}}{{end}}"
                   placeholder="e.g., EGLL"
                   required
                   maxlength="4"
                   pattern="[A-Z]{2,4}"
                   style="text-transform: uppercase;">
            <div class="form-help-text">ICAO code of origin airport (2-4 characters)</div>
        </div>

        <div class="form-group">
            <label class="form-label" for="destination">Destination (ICAO) *</label>
            <input type="text"
                   id="destination"
                   name="destination"
                   class="form-input"
                   value="{{if .IsEdit}}{{.Destination}}{{end}}"
                   placeholder="e.g., EHAM"
                   required
                   maxlength="4"
                   pattern="[A-Z]{2,4}"
                   style="text-transform: uppercase;">
            <div class="form-help-text">ICAO code of destination airport (2-4 characters)</div>
        </div>

        <div class="form-group" onclick="event.stopPropagation();">
            <label class="form-label" for="route_search_input">Route Airtable ID</label>
            <div class="route-search-container" onclick="event.stopPropagation();">
                <input type="text"
                       id="route_search_input"
                       name="q"
                       class="form-input"
                       placeholder="Type to search routes (e.g., KJFK-EGLL)"
                       autocomplete="off"
                       {{if .IsEdit}}{{if .RouteATID}}style="display: none;"{{end}}{{end}}
                       hx-get="/dashboard/events/routes/search"
                       hx-trigger="keyup changed delay:500ms"
                       hx-target="#route-search-dropdown"
                       hx-swap="innerHTML"
                       hx-include="this"
                       hx-on::after-swap="event.stopPropagation();"
                       hx-on::before-swap="event.stopPropagation();"
                       hx-on::after-request="event.stopPropagation();"
                       onclick="event.stopPropagation();"
                       onfocus="event.stopPropagation(); document.getElementById('route_search_display').style.display = 'none'; this.style.display = 'block';">
                <input type="text"
                       id="route_search_display"
                       class="form-input"
                       readonly
                       value="{{if .IsEdit}}{{if .RouteDisplay}}{{.RouteDisplay}}{{end}}{{end}}"
                       style="cursor: pointer; {{if .IsEdit}}{{if not .RouteATID}}display: none;{{end}}{{else}}display: none;{{end}}"
                       onclick="event.stopPropagation(); event.preventDefault(); document.getElementById('route_search_display').style.display = 'none'; document.getElementById('route_search_input').style.display = 'block'; document.getElementById('route_search_input').focus(); document.getElementById('route_at_id').value = ''; return false;">
                <input type="hidden"
                       id="route_at_id"
                       name="route_at_id"
                       value="{{if .IsEdit}}{{.RouteATID}}{{end}}">
                <div id="route-search-dropdown" 
                     onclick="event.stopPropagation();"
                     hx-on::after-swap="event.stopPropagation();"></div>
            </div>
            <div class="form-help-text">Optional: Search and select a route from synced Airtable routes</div>
        </div>

        <div class="form-group">
            <label class="form-label" for="description">Description</label>
            <textarea id="description"
                      name="description"
                      class="form-textarea"
                      placeholder="Optional: Brief description of this leg">{{if .IsEdit}}{{.Description}}{{end}}</textarea>
        </div>

        <div class="form-group">
            <label class="form-label" for="thumbnail_url">Thumbnail URL</label>
            <input type="url"
                   id="thumbnail_url"
                   name="thumbnail_url"
                   class="form-input"
                   value="{{if .IsEdit}}{{.ThumbnailURL}}{{end}}"
                   placeholder="Optional: URL to thumbnail image">
            <div class="form-help-text">Optional: URL to a thumbnail image for this leg</div>
        </div>

        <div class="form-actions">
            <button type="submit" class="form-button button-save">Save</button>
            <button type="button" class="form-button button-cancel" onclick="document.getElementById('leg-form-container').style.display = 'none';">
                Cancel
            </button>
        </div>
    </form>
</div>
{{end}}
