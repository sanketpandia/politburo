{{define "map-legend"}}
<div class="map-legend" aria-label="Flight phase and route legend">
    <span><i class="legend-dot legend-ground"></i>On Ground</span>
    <span><i class="legend-dot legend-landing"></i>Takeoff/Landing</span>
    <span><i class="legend-dot legend-climb"></i>Climb</span>
    <span><i class="legend-dot legend-cruise"></i>Cruise</span>
    <span><i class="legend-dot legend-descent"></i>Descent</span>
    <span><i class="legend-line legend-planned"></i>Planned</span>
    <span><i class="legend-line legend-flown"></i>Flown</span>
</div>
{{end}}
