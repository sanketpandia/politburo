{{define "datasource-schema-selector"}}
<div>
    <div style="margin-bottom: 1.5rem;">
        <button type="button"
                class="ui-button ui-button-secondary"
                hx-get="/dashboard/settings/datasource/status"
                hx-target="#datasource-status-container"
                hx-swap="innerHTML"
                style="margin-bottom: 1rem;">
            ← Back
        </button>
        <h3 style="font-size: 1.5rem; font-weight: 600; color: var(--text-primary); margin-bottom: 0.5rem;">
            Add Schema
        </h3>
        <p style="color: var(--text-secondary);">Select the type of schema you want to configure.</p>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
        {{range .SchemaTypes}}
        <div style="padding: 1.5rem; background-color: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 0.375rem; cursor: pointer; transition: all 0.2s;"
             onmouseover="this.style.borderColor='var(--accent-primary)'; this.style.backgroundColor='var(--bg-secondary)'"
             onmouseout="this.style.borderColor='var(--border-color)'; this.style.backgroundColor='var(--bg-primary)'"
             hx-get="/dashboard/settings/datasource/schema/{{.Type}}"
             hx-target="#datasource-status-container"
             hx-swap="innerHTML">
            <div style="margin-bottom: 0.75rem;">
                <div style="font-size: 1.25rem; margin-bottom: 0.25rem;">{{.Icon}}</div>
                <h4 style="font-size: 1.125rem; font-weight: 600; color: var(--text-primary); margin-bottom: 0.25rem; text-transform: capitalize;">
                    {{.DisplayName}}
                </h4>
            </div>
            <p style="font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 0.5rem;">
                {{.Description}}
            </p>
            {{if .AlreadyConfigured}}
            <span style="padding: 0.125rem 0.5rem; background-color: rgba(34, 197, 94, 0.1); color: #22c55e; border-radius: 0.25rem; font-size: 0.75rem;">
                Configured
            </span>
            {{else}}
            <span style="padding: 0.125rem 0.5rem; background-color: rgba(107, 114, 128, 0.1); color: #6b7280; border-radius: 0.25rem; font-size: 0.75rem;">
                Not Configured
            </span>
            {{end}}
        </div>
        {{end}}
    </div>
</div>
{{end}}
