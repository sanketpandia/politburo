{{define "content"}}
<style>
    .form-card {
        background-color: var(--bg-surface);
        border: 2px solid var(--accent-primary);
        border-radius: 0.5rem;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
    }

    .form-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--border-color);
    }

    .form-title {
        font-size: 1.125rem;
        font-weight: 700;
        color: var(--accent-primary);
    }

    .close-form-btn {
        background: none;
        border: none;
        color: var(--text-muted);
        font-size: 1.5rem;
        cursor: pointer;
        padding: 0;
        width: 2rem;
        height: 2rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 0.25rem;
        transition: all 0.2s ease;
    }

    .close-form-btn:hover {
        background-color: var(--bg-sidebar);
        color: var(--text-primary);
    }

    .form-group {
        margin-bottom: 1.5rem;
    }

    .form-label {
        display: block;
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 0.5rem;
    }

    .form-input,
    .form-textarea,
    .form-select {
        width: 100%;
        padding: 0.625rem;
        background-color: var(--bg-sidebar);
        border: 1px solid var(--border-color);
        border-radius: 0.375rem;
        color: var(--text-primary);
        font-size: 0.95rem;
        font-family: inherit;
        transition: all 0.2s ease;
        box-sizing: border-box;
    }

    .form-input:focus,
    .form-textarea:focus,
    .form-select:focus {
        outline: none;
        border-color: var(--accent-primary);
        box-shadow: 0 0 8px rgba(59, 130, 246, 0.2);
    }

    .form-textarea {
        resize: vertical;
        min-height: 5rem;
    }

    .form-help-text {
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-top: 0.25rem;
    }

    .form-actions {
        display: flex;
        gap: 0.75rem;
        margin-top: 2rem;
        padding-top: 1rem;
        border-top: 1px solid var(--border-color);
    }

    .form-button {
        padding: 0.625rem 1.5rem;
        border-radius: 0.375rem;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: all 0.2s ease;
    }

    .button-save {
        background-color: var(--accent-primary);
        color: white;
        flex: 1;
    }

    .button-save:hover {
        background-color: #2563eb;
    }

    .button-cancel {
        background-color: var(--bg-sidebar);
        color: var(--text-primary);
        border: 1px solid var(--border-color);
        flex: 0 0 auto;
    }

    .button-cancel:hover {
        background-color: var(--bg-surface);
    }
</style>

<div class="form-card">
    <div class="form-header">
        <h2 class="form-title">{{if .IsEdit}}Edit Event{{else}}Create New Event{{end}}</h2>
        <button type="button" class="close-form-btn" onclick="document.getElementById('event-form-container').style.display = 'none';">
            ✕
        </button>
    </div>

    <form {{if .IsEdit}}
          hx-post="/dashboard/events/{{.ID}}/update"
          {{else}}
          hx-post="/dashboard/events/create"
          {{end}}
          hx-on::after-request="if (event.detail.xhr.status === 200) {
              document.getElementById('event-form-container').style.display = 'none';
              htmx.trigger('body', 'eventCreated');
          }"
          hx-target="#events-container"
          hx-swap="innerHTML"
          hx-indicator="#global-spinner">
        <div class="form-group">
            <label class="form-label" for="name">Event Name *</label>
            <input type="text"
                   id="name"
                   name="name"
                   class="form-input"
                   value="{{if .IsEdit}}{{.Name}}{{end}}"
                   placeholder="e.g., Summer Challenge, Group Flight"
                   required
                   maxlength="255">
            <div class="form-help-text">The name of this event</div>
        </div>

        <div class="form-group">
            <label class="form-label" for="description">Description</label>
            <textarea id="description"
                      name="description"
                      class="form-textarea"
                      placeholder="Optional: Brief description of the event">{{if .IsEdit}}{{.Description}}{{end}}</textarea>
            <div class="form-help-text">Optional: Help text for pilots about this event</div>
        </div>

        <div class="form-group">
            <label class="form-label" for="status">Status</label>
            <select id="status" name="status" class="form-select">
                <option value="draft" {{if and .IsEdit (eq .Status "draft")}}selected{{end}}>Draft</option>
                <option value="active" {{if and .IsEdit (eq .Status "active")}}selected{{end}}>Active</option>
                <option value="completed" {{if and .IsEdit (eq .Status "completed")}}selected{{end}}>Completed</option>
                <option value="cancelled" {{if and .IsEdit (eq .Status "cancelled")}}selected{{end}}>Cancelled</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label" for="start_date">Start Date</label>
            <input type="datetime-local"
                   id="start_date"
                   name="start_date"
                   class="form-input"
                   value="{{if .IsEdit}}{{.StartDate}}{{end}}">
            <div class="form-help-text">Optional: Leave empty for immediate start</div>
        </div>

        <div class="form-group">
            <label class="form-label" for="end_date">End Date</label>
            <input type="datetime-local"
                   id="end_date"
                   name="end_date"
                   class="form-input"
                   value="{{if .IsEdit}}{{.EndDate}}{{end}}">
            <div class="form-help-text">Optional: Leave empty for no expiration</div>
        </div>

        <div class="form-actions">
            <button type="submit" class="form-button button-save">Save</button>
            <button type="button" class="form-button button-cancel" onclick="document.getElementById('event-form-container').style.display = 'none';">
                Cancel
            </button>
        </div>
    </form>
</div>
{{end}}
