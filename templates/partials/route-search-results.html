{{define "route-search-results"}}
{{if .Results}}
<div class="route-search-dropdown">
    {{range .Results}}
    <div class="route-search-item"
         onclick="event.stopPropagation(); event.preventDefault(); selectRoute('{{.ATID}}', '{{.Route}}', '{{.Origin}}', '{{.Destination}}');">
        <div style="font-weight: 600; color: var(--text-primary); margin-bottom: 0.25rem;">
            {{.Route}}
        </div>
        <div style="font-size: 0.875rem; color: var(--text-secondary);">
            {{if .Origin}}{{.Origin}}{{else}}?{{end}} → {{if .Destination}}{{.Destination}}{{else}}?{{end}}
        </div>
        <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem;">
            ID: {{.ATID}}
        </div>
    </div>
    {{end}}
</div>
{{else}}
<div class="route-search-dropdown" style="padding: 0.75rem; color: var(--text-secondary);" onclick="event.stopPropagation();">
    No routes found
</div>
{{end}}
{{end}}
