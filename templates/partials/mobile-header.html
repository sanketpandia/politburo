{{define "mobile-header"}}
<!-- Mobile Header Component
     Parameters:
       - PageTitle: Current page title to display
       - ActiveVA: Active virtual airline (optional, for title fallback)
-->
<header class="mobile-header">
    <button class="hamburger-btn" onclick="toggleDrawer()" aria-label="Toggle menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
    </button>
    <div class="mobile-header-title">
        {{if .PageTitle}}{{.PageTitle}}{{else if .ActiveVA}}{{.ActiveVA.VAName}}{{else}}Dashboard{{end}}
    </div>
    <div style="width: 24px;"></div> <!-- Spacer for alignment -->
</header>
{{end}}
