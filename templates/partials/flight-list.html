{{define "flight-list"}}
<section class="live-list-panel" aria-label="Active flights">
    <div class="panel-header">
        <div>
            <h2>Flights</h2>
            <p>Select a row to inspect details and focus the map.</p>
        </div>
    </div>
    <div class="flight-list" data-flight-list>
        {{if .Flights}}
            {{range .Flights}}
            <button class="flight-list-item" type="button" data-flight-id="{{.FlightID}}">
                <span class="flight-list-primary">
                    <strong>{{.Callsign}}</strong>
                    <small>{{if .Username}}{{.Username}}{{else}}Unknown pilot{{end}}</small>
                </span>
                <span class="flight-list-route">{{if .Origin}}{{.Origin}}{{else}}—{{end}} → {{if .Destination}}{{.Destination}}{{else}}—{{end}}</span>
                <span class="flight-list-meta">
                    <span class="status-pill phase-{{.Phase}}">{{.Phase}}</span>
                    <span>{{.Altitude}} ft</span>
                    <span>{{.Speed}} kt</span>
                </span>
            </button>
            {{end}}
        {{else}}
            <div class="empty-state">
                <h3>No active flights</h3>
                <p>Live flights will appear here after the cache job detects VA traffic.</p>
            </div>
        {{end}}
    </div>
</section>
{{end}}
