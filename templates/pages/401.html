{{define "styles"}}
<style>
    .error-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem;
        text-align: center;
    }

    .error-code {
        font-size: 6rem;
        font-weight: 700;
        color: var(--accent-primary);
        margin-bottom: 1rem;
        line-height: 1;
    }

    .error-title {
        font-size: 2rem;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 1rem;
    }

    .error-message {
        font-size: 1.125rem;
        color: var(--text-secondary);
        max-width: 600px;
        margin-bottom: 2rem;
        line-height: 1.6;
    }

    .error-actions {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        align-items: center;
    }

    .discord-info {
        background-color: var(--bg-surface);
        border: 1px solid var(--border-color);
        border-radius: 0.5rem;
        padding: 1.5rem;
        margin-top: 2rem;
        max-width: 500px;
    }

    .discord-info h3 {
        font-size: 1.125rem;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 0.75rem;
    }

    .discord-info p {
        font-size: 0.95rem;
        color: var(--text-secondary);
        margin-bottom: 1rem;
        line-height: 1.6;
    }

    .discord-links {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        align-items: flex-start;
    }

    .discord-link {
        color: var(--accent-primary);
        text-decoration: none;
        font-weight: 500;
        transition: color 0.2s ease;
    }

    .discord-link:hover {
        color: var(--status-info);
    }

    @media (max-width: 640px) {
        .error-code {
            font-size: 4rem;
        }

        .error-title {
            font-size: 1.5rem;
        }

        .error-message {
            font-size: 1rem;
        }
    }
</style>
{{end}}

{{define "content"}}
<div class="error-container">
    <div class="error-code">401</div>
    <h1 class="error-title">Unauthorized</h1>
    <p class="error-message">
        You need to be authenticated to access this page. Please sign in to continue.
    </p>

    <div class="discord-info">
        <h3>Get a Sign-In Link</h3>
        <p>
            You can generate a new sign-in link from Discord by using any of these commands:
        </p>
        <div class="discord-links">
            <a href="#" class="discord-link">/link</a>
            <a href="#" class="discord-link">/live</a>
            <a href="#" class="discord-link">/dashboard</a>
        </div>
    </div>
</div>
{{end}}
