{{define "content"}}
<!-- Page Header -->
<div class="page-header">
    <h2 class="page-title">Flight Modes Configuration</h2>
    <p class="page-subtitle">Configure PIREP submission modes and field visibility for {{.ActiveVA.VAName}}</p>
</div>

<div class="card">
    <div style="margin-bottom: 1.5rem; display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; flex-wrap: wrap;">
        <div>
            <h3 class="page-title" style="font-size: 1.25rem; margin-bottom: 0.5rem;">Flight Modes</h3>
            <p class="page-subtitle" style="font-size: 0.875rem;">Enable or disable modes and customize which fields are shown</p>
        </div>
        <button
            type="button"
            class="btn btn-primary"
            hx-post="/dashboard/vaadmin/flight-modes/create"
            hx-target="#flight-modes-container"
            hx-swap="innerHTML"
            hx-indicator="#global-spinner"
        >
            + Add Flight Mode
        </button>
    </div>

    <!-- Flight Modes List Container (HTMX Target) -->
    <div id="flight-modes-container"
         hx-get="/dashboard/vaadmin/flight-modes/list"
         hx-trigger="load"
         hx-swap="innerHTML"
         hx-indicator="#global-spinner">
        <div style="display: flex; align-items: center; justify-content: center; padding: 2rem; color: var(--text-muted);">
            <p>Loading flight modes...</p>
        </div>
    </div>
</div>
{{end}}
