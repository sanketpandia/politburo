{{define "content"}}
<style>
    /* Page-specific styles using design system variables */
    .pilots-table-container {
        border-radius: 0.5rem;
        overflow: hidden;
        border: 1px solid var(--border-color);
        background-color: var(--bg-surface);
    }

    /* Table styles */
    .pilots-table {
        width: 100%;
        border-collapse: collapse;
    }

    .pilots-table thead {
        background-color: var(--bg-sidebar);
    }

    .pilots-table th {
        padding: 1rem;
        text-align: left;
        font-weight: 600;
        color: var(--text-primary);
        font-size: 0.875rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        border-bottom: 1px solid var(--border-color);
    }

    .pilots-table tbody tr {
        border-bottom: 1px solid var(--border-color);
        transition: background-color 0.2s ease;
    }

    .pilots-table tbody tr:hover {
        background-color: rgba(255, 255, 255, 0.03);
    }

    .pilots-table td {
        padding: 1rem;
        color: var(--text-secondary);
        font-size: 0.875rem;
    }

    /* Role badge */
    .role-badge {
        display: inline-block;
        padding: 0.375rem 0.75rem;
        border-radius: 0.25rem;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .role-pilot {
        background-color: rgba(59, 130, 246, 0.2);
        color: #60a5fa;
        border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .role-staff {
        background-color: rgba(16, 185, 129, 0.2);
        color: #34d399;
        border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .role-admin {
        background-color: rgba(239, 68, 68, 0.2);
        color: #f87171;
        border: 1px solid rgba(239, 68, 68, 0.3);
    }

    /* Action buttons */
    .action-buttons {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        flex-wrap: wrap;
    }

    .role-select {
        padding: 0.375rem 0.5rem;
        border: 1px solid var(--border-color);
        border-radius: 0.25rem;
        background-color: var(--bg-surface);
        color: var(--text-primary);
        font-size: 0.75rem;
    }

    .role-select:focus {
        outline: none;
        border-color: var(--accent-primary);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .btn-action {
        padding: 0.375rem 0.75rem;
        border: 1px solid var(--border-color);
        border-radius: 0.25rem;
        background-color: var(--bg-surface);
        color: var(--text-primary);
        font-size: 0.75rem;
        cursor: pointer;
        transition: all 0.2s ease;
        white-space: nowrap;
    }

    .btn-action:hover {
        background-color: rgba(255, 255, 255, 0.05);
        border-color: var(--accent-primary);
    }

    .btn-remove {
        background-color: rgba(239, 68, 68, 0.2);
        border-color: rgba(239, 68, 68, 0.5);
        color: #f87171;
    }

    .btn-remove:hover {
        background-color: rgba(239, 68, 68, 0.3);
        border-color: #f87171;
    }

    /* Empty state */
    .empty-state {
        padding: 3rem 2rem;
        text-align: center;
        color: var(--text-muted);
    }

    .empty-state p {
        font-size: 0.95rem;
    }

    /* Callsign input styling */
    .callsign-form {
        display: inline-block;
        width: 100%;
        margin: 0;
        padding: 0;
    }

    .callsign-input-group {
        display: flex;
        border-radius: 0.375rem;
        overflow: hidden;
        border: 1px solid var(--border-color);
        background-color: var(--bg-surface);
    }

    .callsign-input {
        flex: 1;
        padding: 0.375rem 0.75rem;
        border: none;
        background-color: var(--bg-surface);
        color: var(--text-primary);
        font-size: 0.875rem;
        outline: none;
        width: 100%;
    }

    .callsign-input:focus {
        background-color: var(--bg-sidebar);
        border: none;
        outline: none;
    }

    .callsign-input::placeholder {
        color: var(--text-muted);
    }

    .callsign-input:invalid {
        color: #f87171;
    }

    .callsign-save-btn {
        padding: 0.375rem 0.75rem;
        border: none;
        border-left: 1px solid var(--border-color);
        background-color: var(--bg-sidebar);
        color: var(--text-primary);
        font-size: 0.875rem;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
    }

    .callsign-save-btn:hover {
        background-color: var(--accent-primary);
        border-left-color: var(--accent-primary);
        color: white;
    }

    .callsign-save-btn:active {
        background-color: #2563eb;
        border-left-color: #2563eb;
    }

    .callsign-icon {
        width: 16px;
        height: 16px;
        stroke-width: 2;
    }

    /* Responsive */
    @media (max-width: 768px) {
        .pilots-table {
            font-size: 0.75rem;
        }

        .pilots-table th,
        .pilots-table td {
            padding: 0.75rem 0.5rem;
        }

        .action-buttons {
            flex-direction: column;
            gap: 0.25rem;
        }

        .role-select,
        .btn-action {
            font-size: 0.7rem;
            padding: 0.25rem 0.5rem;
        }

        .callsign-input {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
        }

        .callsign-save-btn {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
        }

        .callsign-icon {
            width: 14px;
            height: 14px;
        }
    }
</style>

<!-- Page Header -->
<div class="page-header">
    <h2 class="page-title">Manage pilots</h2>
    <p class="page-subtitle">Manage pilots, roles, and callsigns for {{.ActiveVA.VAName}}</p>
</div>

<!-- Pilots Content -->
<div class="card">
    <div style="margin-bottom: 1.5rem;">
        <h3 class="page-title" style="font-size: 1.25rem; margin-bottom: 0.5rem;">Pilots</h3>
        <p class="page-subtitle" style="font-size: 0.875rem;">Manage pilots for {{.ActiveVA.VAName}}</p>
    </div>

    <!-- Search input -->
    <div style="margin-bottom: 1rem;">
        <label class="sr-only" for="pilots-search-input">Search pilots</label>
        <input id="pilots-search-input" 
               class="form-input" 
               type="search" 
               placeholder="Search by callsign, username, or role" 
               data-pilots-search
               style="width: 100%;">
    </div>

    <!-- Pilots Table Container (HTMX Target) -->
    <div id="pilots-container" class="pilots-table-container"
         hx-get="/dashboard/vaadmin/pilots/list"
         hx-trigger="load"
         hx-swap="innerHTML"
         hx-indicator="#global-spinner">
        <!-- Loading state -->
        <div style="display: flex; align-items: center; justify-content: center; padding: 2rem; color: var(--text-muted);">
            <p>Loading pilots...</p>
        </div>
    </div>
</div>

<script type="module">
    import { initPilotsSearch } from '/static/js/pilots-search.mjs';
    initPilotsSearch();
</script>
{{end}}
