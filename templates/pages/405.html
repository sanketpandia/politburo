{{define "styles"}}
<style>
  .err-page {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    justify-content: space-between;
    padding: 2rem 1.5rem;
  }

  .err-stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.25rem;
    max-width: 720px;
    margin: auto;
    text-align: center;
  }

  .err-mono {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8125rem;
    letter-spacing: 0.05em;
  }

  .err-warn {
    color: var(--err-warn);
  }

  .err-h1 {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 600;
    font-size: 1.875rem;
    color: var(--err-ink);
  }

  .err-body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 400;
    font-size: 1rem;
    line-height: 1.6;
    color: var(--err-ink-soft);
    max-width: 520px;
  }

  .err-btn-row {
    display: flex;
    flex-direction: row;
    gap: 0.75rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .err-btn {
    padding: 0.75rem 1.25rem;
    border-radius: 6px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 500;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    font-size: 0.95rem;
    border: none;
    cursor: pointer;
  }

  .err-btn-primary {
    background: var(--err-accent);
    color: var(--err-bg);
  }

  .err-btn-primary:hover {
    filter: brightness(1.1);
  }

  .err-footer {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 400;
    color: var(--err-ink-mute);
    font-size: 0.75rem;
    text-align: center;
  }

  .err-footer a {
    color: inherit;
    text-decoration: none;
  }

  .err-footer a:hover {
    color: var(--err-accent);
  }
</style>
{{end}}

{{define "content"}}
<main class="err-page" id="error-405-page">
  <div class="err-stack">
    <span class="err-mono err-warn">405 · method not allowed</span>
    <h1 class="err-h1">Wrong door</h1>
    <p class="err-body">That request method isn't supported here.</p>
    <div class="err-btn-row">
      <button type="button" id="err-back-btn" class="err-btn err-btn-primary">← back</button>
    </div>
  </div>
  <footer class="err-footer">
    ★ <a href="https://github.com/infinite-experiment">github.com/infinite-experiment</a>
  </footer>
</main>
<script>
  document.getElementById('err-back-btn').addEventListener('click', () => history.back());
</script>
{{end}}
