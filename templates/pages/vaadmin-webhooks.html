{{define "content"}}
<!-- Page Header -->
<div class="page-header">
    <h2 class="page-title">Setup webhooks</h2>
    <p class="page-subtitle">Send live flight snapshots to Discord every 30 minutes</p>
</div>

<div class="card">
    <div style="margin-bottom: 1.5rem;">
        <h3 class="page-title" style="font-size: 1.25rem; margin-bottom: 0.5rem;">Webhooks</h3>
        <p class="page-subtitle" style="font-size: 0.875rem;">Add a Live Flights webhook to post current VA flights to a Discord channel</p>
    </div>

    <!-- Feedback for Run now (HX-Trigger: webhookRunResult) -->
    <div id="webhook-run-feedback" role="status" aria-live="polite" style="margin-bottom: 1rem; min-height: 1.5rem; font-size: 0.875rem;"></div>

    <!-- Webhooks list + add form (HTMX) -->
    <div id="webhooks-container"
         hx-get="/dashboard/vaadmin/webhooks/list"
         hx-trigger="load"
         hx-swap="innerHTML"
         hx-indicator="#global-spinner">
        <div style="display: flex; align-items: center; justify-content: center; padding: 2rem; color: var(--text-muted);">
            <p>Loading webhooks...</p>
        </div>
    </div>
</div>
<script>
document.body.addEventListener('webhookRunResult', function(ev) {
    var d = ev.detail || {};
    var el = document.getElementById('webhook-run-feedback');
    if (!el) return;
    el.textContent = d.message || (d.ok ? 'Sent.' : 'Error.');
    el.style.color = d.ok ? 'var(--success, #34d399)' : 'var(--error, #f87171)';
    setTimeout(function(){ el.textContent = ''; }, 5000);
});
</script>
{{end}}
