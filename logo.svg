 <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
   <defs>
     <!-- Background Gradient (Surface to Deep Void) -->
     <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
       <stop offset="0%" stop-color="#161925"/>
       <stop offset="100%" stop-color="#0f111a"/>
     </linearGradient>
     
     <!-- Plane Gradient (Light Blue to Primary Blue) -->
     <linearGradient id="planeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
       <stop offset="0%" stop-color="#60a5fa"/>
       <stop offset="100%" stop-color="#3b82f6"/>
     </linearGradient>
   </defs>
 
   <!-- Base App Icon Shape (Squircle) -->
   <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="16"/>
 
   <!-- Radar Elements -->
   <circle cx="256" cy="256" r="140" fill="none" stroke="#1e293b" stroke-width="8" stroke-dasharray="12 16" />
   <circle cx="256" cy="256" r="70" fill="none" stroke="#1e293b" stroke-width="8" />
 
   <!-- Flight Path Arc -->
   <path d="M 140 372 Q 180 140 372 140" fill="none" stroke="#10b981" stroke-width="16" stroke-linecap="round" stroke-dasharray="1 36" />
 
   <!-- Airplane Silhouette (Rotated to point top-right) -->
   <g transform="translate(256, 256) rotate(45) translate(-256, -256)">
     <path d="M256 128 C256 128, 272 128, 272 160 L272 232 L368 288 L368 312 L272 288 L272 368 L304 400 L304 424 L256 408 L208 424 L208 400 L240 368 L240 288 L144 312 L144 288 L240 232 L240 160 C240 128, 256 128, 256 128 Z" fill="url(#planeGradient)"/>
   </g>
 </svg>