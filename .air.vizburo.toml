# Air configuration for Vizburo UI service (runs on port 3000)
root = "."
testdata_dir = "testdata"
tmp_dir = ".air_tmp_vizburo"

[build]
  args_bin = []
  bin = "./.air_tmp_vizburo/main"
  cmd = "go build -o .air_tmp_vizburo/main ./cmd/server"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "node_modules"]
  exclude_file = []
  exclude_plain = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  poll = false
  poll_interval = 0
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll_interval = 0
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true
