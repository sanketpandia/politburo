opencollection: 1.0.0
info:
  name: Politburo
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ''
      port: ''
      auth:
        username: ''
        password: ''
      bypassProxy: ''
  environments:
    - name: Dev-Politburp
      variables:
        - name: Base_Url
          value: http://localhost:8080
        - name: D_User_id
          value: ''
        - name: D_Server_Id
          value: ''
        - name: P_Api_Key
          value: ''
        - name: IFC_Id
          value: john_doe
        - name: Last_Flight
          value: KLAX-KSFO
        - name: VA_Code
          value: IFE
        - name: VA_Name
          value: Infinite Flight Express
        - name: Callsign
          value: '123'
        - name: Flight_Id
          value: ''
        - name: Event_Id
          value: ''
        - name: Event_Leg_Id
          value: ''
        - name: Schema_Type
          value: pilot
        - name: Pilot_Page
          value: '1'
        - name: Pirep_Mode
          value: charter
        - name: Mapping_Id
          value: ''
        - name: Mapping_Field_Type
          value: aircraft
        - name: Mapping_Source_Value
          value: Airbus A320
        - name: Mapping_Target_Value
          value: A320 Family
        - name: Default_Aircraft
          value: Airbus A320
        - name: Default_Airline
          value: Infinite Flight Express
        - name: Airtable_Api_Key
          value: ''
        - name: Airtable_Base_Id
          value: ''
        - name: Airtable_Table_Name
          value: Pilots
request:
  headers:
    - name: X-Discord-User-Id
      value: '{{D_User_id}}'
    - name: X-Discord-Server-Id
      value: '{{D_Server_Id}}'
    - name: X-API-Key
      value: '{{P_Api_Key}}'
bundled: true
items:
  - info:
      name: Health
      type: folder
      seq: 1
    items:
      - info:
          name: Health Check
          type: http
          seq: 1
          tags:
            - health
            - smoke
        http:
          method: GET
          url: '{{Base_Url}}/healthCheck'
          auth: none
        runtime:
          assertions:
            - expression: res.status
              operator: eq
              value: '200'
            - expression: res.body.status
              operator: isString
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          Public liveness endpoint mounted at `GET /healthCheck`.

  - info:
      name: Registration & Onboarding
      type: folder
      seq: 2
    items:
      - info:
          name: Register Pilot
          type: http
          seq: 1
          tags:
            - registration
            - onboarding
        http:
          method: POST
          url: '{{Base_Url}}/api/v1/user/register'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |-
              {
                "ifc_id": "{{IFC_Id}}",
                "last_flight": "{{Last_Flight}}"
              }
          auth: inherit
        runtime:
          assertions:
            - expression: res.status
              operator: eq
              value: '201'
            - expression: res.body.status
              operator: eq
              value: ok
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          Registers a Discord user as a pilot using IFC verification.

      - info:
          name: Initialize Server
          type: http
          seq: 2
          tags:
            - registration
            - onboarding
        http:
          method: POST
          url: '{{Base_Url}}/api/v1/server/init'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |-
              {
                "va_code": "{{VA_Code}}"
              }
          auth: inherit
        runtime:
          assertions:
            - expression: res.status
              operator: eq
              value: '201'
            - expression: res.body.status
              operator: eq
              value: ok
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          Initializes the current Discord server as a virtual airline.

      - info:
          name: Join Membership
          type: http
          seq: 3
          tags:
            - registration
            - onboarding
        http:
          method: POST
          url: '{{Base_Url}}/api/v1/memberships/join'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |-
              {
                "callsign": "{{Callsign}}"
              }
          auth: inherit
        runtime:
          assertions:
            - expression: res.status
              operator: eq
              value: '201'
            - expression: res.body.status
              operator: eq
              value: ok
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          Joins the VA associated with the current Discord server.

      - info:
          name: Get User Status
          type: http
          seq: 4
          tags:
            - registration
            - onboarding
        http:
          method: GET
          url: '{{Base_Url}}/api/v1/user/status'
          auth: inherit
        runtime:
          assertions:
            - expression: res.status
              operator: eq
              value: '200'
            - expression: res.body.status
              operator: eq
              value: ok
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          Returns registration and membership status for the authenticated Discord user.

      - info:
          name: Generate Signed Dashboard Link
          type: http
          seq: 5
          tags:
            - registration
            - dashboard
        http:
          method: POST
          url: '{{Base_Url}}/api/v1/signed-link'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |-
              {
                "redirect_to": "/dashboard",
                "ttl_minutes": 15
              }
          auth: inherit
        runtime:
          assertions:
            - expression: res.status
              operator: eq
              value: '200'
            - expression: res.body.status
              operator: eq
              value: ok
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          Generates a presigned Vizburo dashboard URL for the authenticated user.

  - info:
      name: Pilot Stats & Logbook
      type: folder
      seq: 3
    items:
      - info:
          name: Get Pilot Stats
          type: http
          seq: 1
          tags:
            - pilots
            - stats
        http:
          method: GET
          url: '{{Base_Url}}/api/v1/pilot/stats'
          auth: inherit
        runtime:
          assertions:
            - expression: res.status
              operator: eq
              value: '200'
            - expression: res.body.status
              operator: eq
              value: ok
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          Returns pilot stats for the authenticated user in the active VA context.

      - info:
          name: Get Staff Logbook By IFC ID
          type: http
          seq: 2
          tags:
            - pilots
            - logbook
            - staff
        http:
          method: GET
          url: '{{Base_Url}}/api/v1/pilots/{{IFC_Id}}/logbook?page={{Pilot_Page}}'
          auth: inherit
        runtime:
          assertions:
            - expression: res.body.status
              operator: isString
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          Staff/admin-only logbook lookup by IFC ID.

      - info:
          name: Get Self-Service Flights By IFC ID
          type: http
          seq: 3
          tags:
            - pilots
            - logbook
        http:
          method: GET
          url: '{{Base_Url}}/api/v1/user/{{IFC_Id}}/flights?page={{Pilot_Page}}'
          auth: inherit
        runtime:
          assertions:
            - expression: res.body.status
              operator: isString
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          Returns paginated flight history for the current user or authorized viewer.

  - info:
      name: Live Flights
      type: folder
      seq: 4
    items:
      - info:
          name: Get VA Live Flights
          type: http
          seq: 1
          tags:
            - flights
            - live
        http:
          method: GET
          url: '{{Base_Url}}/api/v1/flights/va'
          auth: inherit
        runtime:
          assertions:
            - expression: res.body.status
              operator: isString
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          Returns cached live flights for the active VA plus a signed dashboard link when available.

      - info:
          name: Get Flight By ID
          type: http
          seq: 2
          tags:
            - flights
            - live
        http:
          method: GET
          url: '{{Base_Url}}/api/v1/flights/{{Flight_Id}}'
          auth: inherit
        runtime:
          assertions:
            - expression: res.body.status
              operator: isString
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          Returns a cached single live flight by flight ID.

  - info:
      name: PIREPs
      type: folder
      seq: 5
    items:
      - info:
          name: Get PIREP Config
          type: http
          seq: 1
          tags:
            - pireps
        http:
          method: GET
          url: '{{Base_Url}}/api/v1/pireps/config'
          auth: inherit
        runtime:
          assertions:
            - expression: res.body.status
              operator: isString
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          Returns flight-mode and current-flight context for PIREP filing.

      - info:
          name: Submit PIREP
          type: http
          seq: 2
          tags:
            - pireps
        http:
          method: POST
          url: '{{Base_Url}}/api/v1/pireps/submit'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |-
              {
                "mode": "{{Pirep_Mode}}"
              }
          auth: inherit
        runtime:
          assertions:
            - expression: res.body
              operator: isObject
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          Submits a PIREP using minimal test payload. This route is legacy-sensitive and may require richer real payloads depending on configured mode.

  - info:
      name: Events API
      type: folder
      seq: 6
    items:
      - info:
          name: List Events
          type: http
          seq: 1
          tags:
            - events
        http:
          method: GET
          url: '{{Base_Url}}/api/v1/events'
          auth: inherit
        runtime:
          assertions:
            - expression: res.status
              operator: eq
              value: '200'
            - expression: res.body.status
              operator: eq
              value: ok
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          Lists events for the active VA.

      - info:
          name: Create Event
          type: http
          seq: 2
          tags:
            - events
        http:
          method: POST
          url: '{{Base_Url}}/api/v1/events'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |-
              {
                "name": "Bruno Test Event",
                "description": "Created from Bruno",
                "status": "draft"
              }
          auth: inherit
        runtime:
          assertions:
            - expression: res.body.status
              operator: isString
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          Creates an event with a minimal JSON body for testing.

      - info:
          name: Get Event PIREP Config
          type: http
          seq: 3
          tags:
            - events
            - pireps
        http:
          method: GET
          url: '{{Base_Url}}/api/v1/events/pirep-config'
          auth: inherit
        runtime:
          assertions:
            - expression: res.body.status
              operator: isString
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          Returns event-related PIREP configuration data.

      - info:
          name: Get Event By ID
          type: http
          seq: 4
          tags:
            - events
        http:
          method: GET
          url: '{{Base_Url}}/api/v1/events/{{Event_Id}}'
          auth: inherit
        runtime:
          assertions:
            - expression: res.body.status
              operator: isString
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          Gets an event by ID.

      - info:
          name: Update Event By ID
          type: http
          seq: 5
          tags:
            - events
        http:
          method: PUT
          url: '{{Base_Url}}/api/v1/events/{{Event_Id}}'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |-
              {
                "name": "Bruno Updated Event",
                "description": "Updated from Bruno"
              }
          auth: inherit
        runtime:
          assertions:
            - expression: res.body.status
              operator: isString
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          Updates an event by ID with a small test payload.

      - info:
          name: Update Event Status
          type: http
          seq: 6
          tags:
            - events
        http:
          method: PATCH
          url: '{{Base_Url}}/api/v1/events/{{Event_Id}}/status'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |-
              {
                "status": "published"
              }
          auth: inherit
        runtime:
          assertions:
            - expression: res.body.status
              operator: isString
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          Patches event status.

      - info:
          name: Get Event Summary
          type: http
          seq: 7
          tags:
            - events
        http:
          method: GET
          url: '{{Base_Url}}/api/v1/events/{{Event_Id}}/summary'
          auth: inherit
        runtime:
          assertions:
            - expression: res.body.status
              operator: isString
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          Returns summary data for an event.

      - info:
          name: List Event Legs
          type: http
          seq: 8
          tags:
            - events
            - legs
        http:
          method: GET
          url: '{{Base_Url}}/api/v1/events/{{Event_Id}}/legs'
          auth: inherit
        runtime:
          assertions:
            - expression: res.body.status
              operator: isString
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          Lists legs for an event.

      - info:
          name: Create Event Leg
          type: http
          seq: 9
          tags:
            - events
            - legs
        http:
          method: POST
          url: '{{Base_Url}}/api/v1/events/{{Event_Id}}/legs'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |-
              {
                "origin": "KLAX",
                "destination": "KSFO"
              }
          auth: inherit
        runtime:
          assertions:
            - expression: res.body.status
              operator: isString
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          Creates a simple event leg.

      - info:
          name: Get Event Leg By ID
          type: http
          seq: 10
          tags:
            - events
            - legs
        http:
          method: GET
          url: '{{Base_Url}}/api/v1/events/{{Event_Id}}/legs/{{Event_Leg_Id}}'
          auth: inherit
        runtime:
          assertions:
            - expression: res.body.status
              operator: isString
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          Gets an event leg by leg ID.

      - info:
          name: Update Event Leg By ID
          type: http
          seq: 11
          tags:
            - events
            - legs
        http:
          method: PUT
          url: '{{Base_Url}}/api/v1/events/{{Event_Id}}/legs/{{Event_Leg_Id}}'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |-
              {
                "origin": "KLAX",
                "destination": "KSEA"
              }
          auth: inherit
        runtime:
          assertions:
            - expression: res.body.status
              operator: isString
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          Updates an event leg by leg ID.

      - info:
          name: Patch Event Leg Additional Data
          type: http
          seq: 12
          tags:
            - events
            - legs
        http:
          method: PATCH
          url: '{{Base_Url}}/api/v1/events/{{Event_Id}}/legs/{{Event_Leg_Id}}/additional-data'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |-
              {
                "thumbnail_url": "https://example.com/thumbnail.png"
              }
          auth: inherit
        runtime:
          assertions:
            - expression: res.body.status
              operator: isString
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          Patches extra event leg data.

      - info:
          name: Delete Event Leg By ID
          type: http
          seq: 13
          tags:
            - events
            - legs
        http:
          method: DELETE
          url: '{{Base_Url}}/api/v1/events/{{Event_Id}}/legs/{{Event_Leg_Id}}'
          auth: inherit
        runtime:
          assertions:
            - expression: res.body.status
              operator: isString
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          Deletes an event leg by leg ID.

      - info:
          name: Delete Event By ID
          type: http
          seq: 14
          tags:
            - events
        http:
          method: DELETE
          url: '{{Base_Url}}/api/v1/events/{{Event_Id}}'
          auth: inherit
        runtime:
          assertions:
            - expression: res.body.status
              operator: isString
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          Deletes an event by ID.

  - info:
      name: Admin Auth & Sessions
      type: folder
      seq: 7
    items:
      - info:
          name: Verify God Mode
          type: http
          seq: 1
          tags:
            - admin
            - auth
        http:
          method: GET
          url: '{{Base_Url}}/api/v1/admin/verify-god'
          auth: inherit
        runtime:
          assertions:
            - expression: res.status
              operator: eq
              value: '200'
            - expression: res.body.status
              operator: eq
              value: ok
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          Returns whether the authenticated request is in god mode.

      - info:
          name: Destroy Sessions By IFC ID
          type: http
          seq: 2
          tags:
            - admin
            - sessions
        http:
          method: POST
          url: '{{Base_Url}}/api/v1/admin/sessions/destroy/{{IFC_Id}}'
          auth: inherit
        runtime:
          assertions:
            - expression: res.body.status
              operator: isString
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          Destroys sessions for a user identified by IFC ID. Requires admin and god-mode key middleware.

  - info:
      name: Airtable Admin API
      type: folder
      seq: 8
    items:
      - info:
          name: Save Airtable Credentials
          type: http
          seq: 1
          tags:
            - admin
            - airtable
        http:
          method: POST
          url: '{{Base_Url}}/api/v1/admin/airtable/credentials'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |-
              {
                "api_key": "{{Airtable_Api_Key}}",
                "base_id": "{{Airtable_Base_Id}}"
              }
          auth: inherit
        runtime:
          assertions:
            - expression: res.body.status
              operator: isString
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          Saves Airtable credentials for the active VA.

      - info:
          name: Get Airtable Credentials
          type: http
          seq: 2
          tags:
            - admin
            - airtable
        http:
          method: GET
          url: '{{Base_Url}}/api/v1/admin/airtable/credentials'
          auth: inherit
        runtime:
          assertions:
            - expression: res.body.status
              operator: isString
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          Reads Airtable credentials for the active VA.

      - info:
          name: Save Airtable Schema
          type: http
          seq: 3
          tags:
            - admin
            - airtable
        http:
          method: POST
          url: '{{Base_Url}}/api/v1/admin/airtable/schema/{{Schema_Type}}'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |-
              {
                "table_name": "{{Airtable_Table_Name}}"
              }
          auth: inherit
        runtime:
          assertions:
            - expression: res.body.status
              operator: isString
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          Saves a schema configuration for the active VA.

      - info:
          name: Get Airtable Schema
          type: http
          seq: 4
          tags:
            - admin
            - airtable
        http:
          method: GET
          url: '{{Base_Url}}/api/v1/admin/airtable/schema/{{Schema_Type}}'
          auth: inherit
        runtime:
          assertions:
            - expression: res.body.status
              operator: isString
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          Reads a schema configuration by schema type.

      - info:
          name: List Airtable Schemas
          type: http
          seq: 5
          tags:
            - admin
            - airtable
        http:
          method: GET
          url: '{{Base_Url}}/api/v1/admin/airtable/schemas'
          auth: inherit
        runtime:
          assertions:
            - expression: res.body.status
              operator: isString
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          Lists schema configurations for the active VA.

  - info:
      name: Livery Mappings
      type: folder
      seq: 9
    items:
      - info:
          name: List Livery Mappings
          type: http
          seq: 1
          tags:
            - admin
            - livery-mappings
        http:
          method: GET
          url: '{{Base_Url}}/api/v1/admin/livery-mappings'
          auth: inherit
        runtime:
          assertions:
            - expression: res.status
              operator: eq
              value: '200'
            - expression: res.body.status
              operator: eq
              value: ok
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
        docs: |-
          Returns livery mappings for the active VA.

      - info:
          name: Create Livery Mappings
          type: http
          seq: 2
          tags:
            - admin
            - livery-mappings
        http:
          method: POST
          url: '{{Base_Url}}/api/v1/admin/livery-mappings'
          headers:
            - name: Content-Type
              value: application/json
          body:
            type: json
            data: |-
              {
                "fieldType": "{{Mapping_Field_Type}}",
                "sourceValue": "{{Mapping_Source_Value}}",
                "targetValue": "{{Mapping_Target_Value}}"
              }
          auth: inherit
        runtime:
          assertions:
            - expression: res.body.status
              operator: isString
        settings:
