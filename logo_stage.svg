<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient (Burnt Orange to Deep Ember) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A1406"/>
      <stop offset="100%" stop-color="#120A03"/>
    </linearGradient>

    <!-- Plane Gradient (Amber to Vibrant Orange) -->
    <linearGradient id="planeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB15E"/>
      <stop offset="100%" stop-color="#FF7A00"/>
    </linearGradient>

    <!-- Soft Glow -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base App Icon Shape (Squircle) -->
  <rect
    x="32"
    y="32"
    width="448"
    height="448"
    rx="100"
    fill="url(#bgGradient)"
    stroke="#3A1F08"
    stroke-width="16"
  />

  <!-- Radar Elements -->
  <circle
    cx="256"
    cy="256"
    r="140"
    fill="none"
    stroke="#3B220C"
    stroke-width="8"
    stroke-dasharray="12 16"
  />

  <circle
    cx="256"
    cy="256"
    r="70"
    fill="none"
    stroke="#2A1708"
    stroke-width="8"
  />

  <!-- Flight Path Arc -->
  <path
    d="M 140 372 Q 180 140 372 140"
    fill="none"
    stroke="#FF8A1F"
    stroke-width="16"
    stroke-linecap="round"
    stroke-dasharray="1 36"
    filter="url(#softGlow)"
  />

  <!-- Airplane Silhouette -->
  <g transform="translate(256, 256) rotate(45) translate(-256, -256)">
    <path
      d="M256 128
         C256 128, 272 128, 272 160
         L272 232
         L368 288
         L368 312
         L272 288
         L272 368
         L304 400
         L304 424
         L256 408
         L208 424
         L208 400
         L240 368
         L240 288
         L144 312
         L144 288
         L240 232
         L240 160
         C240 128, 256 128, 256 128 Z"
      fill="url(#planeGradient)"
    />
  </g>
</svg>

Create an agent for this project. This will be a product kind of an agent. It will suggest how to implement features and will think from an user perspective. This application has 3 components from a user perspective. A discord bot that they can interact with - Here they can register and stuff and get links to the web UI. the web UI is the 2nd component. There are 3 types of users. This entire project is about a game called infinite flight. This is a multiplayer mobile flight simulator and player communities have created virtual airlines and then onboard pilots who fly based on the quirks and specs of individual virtual airlines and they have discord servers for each VAs. Our bot will basically act as an interface between the game and the virtual airlines. These airlines use their own databases and stuff, so our bot should interface between the airtable and the game APIs and then provide features according to that. We have some basics, like all currently flying users in a VA based on the callsigns etc which are already implemented. Third part is the common backend which facilitates both UI and bot. The UI also has admin configs to setup their connectors to airtable for individual features, setting up events etc. The game APIs are in https://infiniteflight.com/guide/developer-reference/live-api/overview and we are providing connectors for airtable for now. this agent's task will be service and come up and design features along this use case