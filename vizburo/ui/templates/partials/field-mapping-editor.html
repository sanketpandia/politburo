{{define "field-mapping-editor"}}
<!-- Field Mapping Editor - Reusable Component -->
<!-- Usage: {{template "field-mapping-editor" dict "EntityType" "pilot" "Fields" .Fields}} -->

<div class="field-mapping-container" data-entity-type="{{.EntityType}}">
    <table class="field-mapping-table">
        <thead>
            <tr>
                <th>Internal Name</th>
                <th>Airtable Name</th>
                <th>Data Type</th>
                <th style="text-align: center;">Required</th>
                <th>Display Name</th>
                <th style="text-align: center;" title="Visible in user-facing APIs">User Visible</th>
                <th style="text-align: center;" title="Appends bot metadata/notes to this field">Bot Metadata</th>
                <th>Display Format</th>
                <th style="width: 80px;">Action</th>
            </tr>
        </thead>
        <tbody id="field-rows-{{.EntityType}}">
            {{if .Fields}}
                {{range $index, $field := .Fields}}
                <tr class="field-row" data-field-index="{{$index}}">
                    <td>
                        <input type="text"
                               class="field-input internal-name"
                               value="{{$field.InternalName}}"
                               placeholder="e.g., callsign"
                               data-entity="{{$.EntityType}}">
                    </td>
                    <td>
                        <input type="text"
                               class="field-input airtable-name"
                               value="{{$field.AirtableName}}"
                               placeholder="e.g., Callsign"
                               data-entity="{{$.EntityType}}">
                    </td>
                    <td>
                        <select class="field-input data-type" data-entity="{{$.EntityType}}">
                            <option value="string" {{if eq $field.DataType "string"}}selected{{end}}>String</option>
                            <option value="int" {{if eq $field.DataType "int"}}selected{{end}}>Integer</option>
                            <option value="float" {{if eq $field.DataType "float"}}selected{{end}}>Float</option>
                            <option value="boolean" {{if eq $field.DataType "boolean"}}selected{{end}}>Boolean</option>
                            <option value="date" {{if eq $field.DataType "date"}}selected{{end}}>Date</option>
                        </select>
                    </td>
                    <td style="text-align: center;">
                        <input type="checkbox"
                               class="required-checkbox"
                               {{if $field.Required}}checked{{end}}
                               data-entity="{{$.EntityType}}">
                    </td>
                    <td>
                        <input type="text"
                               class="field-input display-name"
                               value="{{$field.DisplayName}}"
                               placeholder="e.g., Pilot Callsign"
                               data-entity="{{$.EntityType}}">
                    </td>
                    <td style="text-align: center;">
                        <input type="checkbox"
                               class="user-visible-checkbox"
                               {{if $field.IsUserVisible}}checked{{else}}checked{{end}}
                               data-entity="{{$.EntityType}}">
                    </td>
                    <td style="text-align: center;">
                        <input type="checkbox"
                               class="bot-metadata-checkbox"
                               {{if $field.BotMetadata}}checked{{end}}
                               data-entity="{{$.EntityType}}"
                               onchange="validateBotMetadata('{{$.EntityType}}')">
                    </td>
                    <td>
                        <select class="field-input display-format" data-entity="{{$.EntityType}}">
                            <option value="">None</option>
                            <option value="duration" {{if eq $field.DisplayFormat "duration"}}selected{{end}}>Duration</option>
                            <option value="date" {{if eq $field.DisplayFormat "date"}}selected{{end}}>Date</option>
                            <option value="datetime" {{if eq $field.DisplayFormat "datetime"}}selected{{end}}>DateTime</option>
                        </select>
                    </td>
                    <td>
                        <button type="button"
                                class="btn-remove-field"
                                onclick="removeFieldRow(this, '{{$.EntityType}}')">
                            Remove
                        </button>
                    </td>
                </tr>
                {{end}}
            {{end}}
        </tbody>
    </table>

    <button type="button"
            class="btn-add-field"
            onclick="addFieldRow('{{.EntityType}}')">
        + Add Field Mapping
    </button>

    <!-- Hidden JSON input to store serialized field mappings -->
    <input type="hidden"
           id="fields-json-{{.EntityType}}"
           name="fields_{{.EntityType}}"
           class="fields-json-input"
           data-entity="{{.EntityType}}">
</div>

<script>
function removeFieldRow(button, entityType) {
    const row = button.closest('.field-row');
    row.remove();
    updateFieldJSON(entityType);
}

function addFieldRow(entityType) {
    const tbody = document.getElementById('field-rows-' + entityType);
    const rowIndex = tbody.children.length;

    const newRow = document.createElement('tr');
    newRow.className = 'field-row';
    newRow.innerHTML = `
        <td>
            <input type="text"
                   class="field-input internal-name"
                   placeholder="e.g., callsign"
                   data-entity="${entityType}">
        </td>
        <td>
            <input type="text"
                   class="field-input airtable-name"
                   placeholder="e.g., Callsign"
                   data-entity="${entityType}">
        </td>
        <td>
            <select class="field-input data-type" data-entity="${entityType}">
                <option value="string">String</option>
                <option value="int">Integer</option>
                <option value="float">Float</option>
                <option value="boolean">Boolean</option>
                <option value="date">Date</option>
            </select>
        </td>
        <td style="text-align: center;">
            <input type="checkbox"
                   class="required-checkbox"
                   data-entity="${entityType}">
        </td>
        <td>
            <input type="text"
                   class="field-input display-name"
                   placeholder="e.g., Pilot Callsign"
                   data-entity="${entityType}">
        </td>
        <td style="text-align: center;">
            <input type="checkbox"
                   class="user-visible-checkbox"
                   checked
                   data-entity="${entityType}">
        </td>
        <td style="text-align: center;">
            <input type="checkbox"
                   class="bot-metadata-checkbox"
                   data-entity="${entityType}"
                   onchange="validateBotMetadata('${entityType}')">
        </td>
        <td>
            <select class="field-input display-format" data-entity="${entityType}">
                <option value="">None</option>
                <option value="duration">Duration</option>
                <option value="date">Date</option>
                <option value="datetime">DateTime</option>
            </select>
        </td>
        <td>
            <button type="button"
                    class="btn-remove-field"
                    onclick="removeFieldRow(this, '${entityType}')">
                Remove
            </button>
        </td>
    `;

    tbody.appendChild(newRow);
    updateFieldJSON(entityType);
}

function updateFieldJSON(entityType) {
    const tbody = document.getElementById('field-rows-' + entityType);
    const rows = tbody.querySelectorAll('.field-row');
    const fields = [];

    rows.forEach(row => {
        const field = {
            internal_name: row.querySelector('.internal-name').value,
            airtable_name: row.querySelector('.airtable-name').value,
            data_type: row.querySelector('.data-type').value,
            required: row.querySelector('.required-checkbox').checked,
            display_name: row.querySelector('.display-name').value,
            is_user_visible: row.querySelector('.user-visible-checkbox').checked,
            bot_metadata: row.querySelector('.bot-metadata-checkbox').checked,
            display_format: row.querySelector('.display-format').value || null
        };
        if (field.internal_name && field.airtable_name) {
            fields.push(field);
        }
    });

    const jsonInput = document.getElementById('fields-json-' + entityType);
    jsonInput.value = JSON.stringify(fields);
}

function validateBotMetadata(entityType) {
    const tbody = document.getElementById('field-rows-' + entityType);
    const botMetadataCheckboxes = tbody.querySelectorAll('.bot-metadata-checkbox');
    let botMetadataCount = 0;

    botMetadataCheckboxes.forEach(checkbox => {
        if (checkbox.checked) {
            botMetadataCount++;
        }
    });

    if (botMetadataCount > 1) {
        // Uncheck the last clicked checkbox and show error
        event.target.checked = false;
        alert('Only one field per entity can have "Bot Metadata" enabled.');
        return false;
    }

    updateFieldJSON(entityType);
    return true;
}

function validateFieldMappings(entityType) {
    const tbody = document.getElementById('field-rows-' + entityType);
    const rows = tbody.querySelectorAll('.field-row');
    const internalNames = new Set();
    const airtableNames = new Set();
    let hasError = false;

    rows.forEach((row, index) => {
        const internalName = row.querySelector('.internal-name').value.trim();
        const airtableName = row.querySelector('.airtable-name').value.trim();

        // Check for empty required fields
        if (internalName === '' || airtableName === '') {
            if (internalName === '') {
                row.querySelector('.internal-name').style.borderColor = 'var(--nord11)';
            }
            if (airtableName === '') {
                row.querySelector('.airtable-name').style.borderColor = 'var(--nord11)';
            }
            hasError = true;
            return;
        }

        // Reset border color
        row.querySelector('.internal-name').style.borderColor = '';
        row.querySelector('.airtable-name').style.borderColor = '';

        // Check for duplicate internal names
        if (internalNames.has(internalName)) {
            row.querySelector('.internal-name').style.borderColor = 'var(--nord11)';
            hasError = true;
        }
        internalNames.add(internalName);

        // Check for duplicate airtable names
        if (airtableNames.has(airtableName)) {
            row.querySelector('.airtable-name').style.borderColor = 'var(--nord11)';
            hasError = true;
        }
        airtableNames.add(airtableName);
    });

    return !hasError;
}
</script>
{{end}}
