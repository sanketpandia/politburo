{{define "content"}}
<style>
    :root {
        --nord0: #2E3440;
        --nord1: #3B4252;
        --nord2: #434C5E;
        --nord3: #4C566A;
        --nord4: #D8DEE9;
        --nord5: #E5E9F0;
        --nord6: #ECEFF4;
        --nord8: #88C0D0;
        --nord9: #81A1C1;
        --nord11: #BF616A;
        --nord14: #A3BE8C;
    }

    .page-header {
        margin-bottom: 2rem;
    }

    .page-title {
        font-size: 1.875rem;
        font-weight: 700;
        color: var(--nord6);
        margin-bottom: 0.5rem;
    }

    .page-subtitle {
        font-size: 0.95rem;
        color: var(--nord4);
    }

    .secondary-nav {
        display: flex;
        gap: 1rem;
        margin-bottom: 2rem;
        border-bottom: 2px solid var(--nord3);
        flex-wrap: wrap;
    }

    .secondary-nav-item {
        padding: 0.75rem 1.5rem;
        font-size: 0.95rem;
        font-weight: 500;
        color: var(--nord4);
        text-decoration: none;
        cursor: pointer;
        border-bottom: 3px solid transparent;
        transition: all 0.2s ease;
        white-space: nowrap;
    }

    .secondary-nav-item:hover {
        color: var(--nord6);
        border-bottom-color: var(--nord8);
    }

    .secondary-nav-item.active {
        color: var(--nord8);
        border-bottom-color: var(--nord8);
    }

    .modes-container {
        margin-top: 2rem;
    }

    .loading-spinner {
        text-align: center;
        padding: 2rem;
        color: var(--nord4);
    }

    .spinner {
        display: inline-block;
        width: 1.5rem;
        height: 1.5rem;
        border: 2px solid var(--nord3);
        border-top-color: var(--nord8);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    /* Responsive */
    @media (max-width: 640px) {
        .page-title {
            font-size: 1.5rem;
        }

        .secondary-nav {
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .secondary-nav-item {
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
        }
    }
</style>

<!-- Secondary Navigation -->
{{template "secondary-nav" dict "ActiveVA" .ActiveVA "CurrentPage" "pirep" "IsAdmin" .IsAdmin "IsStaff" .IsStaff}}

<!-- Page Header -->
<div class="page-header">
    <h1 class="page-title">⚙️ PIREP Configuration</h1>
    <p class="page-subtitle">Manage flight modes and submission settings for your virtual airline</p>
</div>

<!-- Modes Container (loads via HTMX) -->
<div class="modes-container" id="pirep-modes-container">
    <div class="loading-spinner">
        <div class="spinner"></div>
        <p style="margin-top: 1rem;">Loading PIREP configurations...</p>
    </div>
</div>

<!-- Load modes on page load -->
<script>
(function() {
    function loadPirepConfig() {
        const container = document.getElementById('pirep-modes-container');
        if (!container) return;

        // Use fetch API to load the modes list on page load
        fetch('/dashboard/settings/pirep/config', {
            method: 'GET',
            headers: {
                'Content-Type': 'text/html',
                'HX-Request': 'true'
            }
        })
        .then(response => {
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.text();
        })
        .then(html => {
            container.innerHTML = html;
            // Trigger HTMX to process any new elements
            if (window.htmx) {
                htmx.process(container);
            }
        })
        .catch(error => {
            console.error('Error loading PIREP config:', error);
            container.innerHTML = '<div style="color: var(--nord11); padding: 2rem; text-align: center;">Error loading configurations. Please try again.<br><small>' + error.message + '</small></div>';
        });
    }

    // Wait for DOM to be ready
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadPirepConfig);
    } else {
        loadPirepConfig();
    }
})();
</script>
{{end}}
