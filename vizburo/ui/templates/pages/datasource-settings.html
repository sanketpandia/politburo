{{define "content"}}
<style>
    :root {
        --nord0: #2E3440;
        --nord1: #3B4252;
        --nord2: #434C5E;
        --nord3: #4C566A;
        --nord4: #D8DEE9;
        --nord5: #E5E9F0;
        --nord6: #ECEFF4;
        --nord7: #8FBCBB;
        --nord8: #88C0D0;
        --nord9: #81A1C1;
        --nord10: #5E81AC;
        --nord11: #BF616A;
        --nord12: #D08770;
        --nord13: #EBCB8B;
        --nord14: #A3BE8C;
        --nord15: #B48EAD;
    }

    .secondary-nav {
        display: flex;
        gap: 1rem;
        margin-bottom: 2rem;
        border-bottom: 2px solid var(--nord3);
        flex-wrap: wrap;
    }

    .secondary-nav-item {
        padding: 0.75rem 1.5rem;
        font-size: 0.95rem;
        font-weight: 500;
        color: var(--nord4);
        text-decoration: none;
        cursor: pointer;
        border-bottom: 3px solid transparent;
        transition: all 0.2s ease;
        white-space: nowrap;
    }

    .secondary-nav-item:hover {
        color: var(--nord6);
        border-bottom-color: var(--nord8);
    }

    .secondary-nav-item.active {
        color: var(--nord8);
        border-bottom-color: var(--nord8);
    }

    .page-header {
        margin-bottom: 2rem;
    }

    .page-header h2 {
        font-size: 1.75rem;
        font-weight: 700;
        color: var(--nord6);
        margin-bottom: 0.5rem;
    }

    .page-header p {
        font-size: 0.95rem;
        color: var(--nord4);
    }

    .config-container {
        background-color: var(--nord1);
        border: 1px solid var(--nord3);
        border-radius: 0.5rem;
        padding: 2rem;
    }

    .form-group {
        margin-bottom: 1.5rem;
    }

    .form-label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
        color: var(--nord6);
        font-size: 0.95rem;
    }

    .form-label.required::after {
        content: " *";
        color: var(--nord11);
    }

    .form-input,
    .form-select {
        width: 100%;
        padding: 0.625rem 0.75rem;
        border: 1px solid var(--nord3);
        border-radius: 0.25rem;
        background-color: var(--nord0);
        color: var(--nord6);
        font-size: 0.875rem;
    }

    .form-input:focus,
    .form-select:focus {
        outline: none;
        border-color: var(--nord8);
        box-shadow: 0 0 0 3px rgba(136, 192, 208, 0.1);
    }

    .form-input::placeholder {
        color: var(--nord3);
    }

    .section-title {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--nord6);
        margin-top: 2.5rem;
        margin-bottom: 1.5rem;
        padding-bottom: 1rem;
        border-bottom: 2px solid var(--nord3);
    }

    .tab-container {
        margin-top: 2rem;
    }

    .tab-buttons {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
    }

    .tab-button {
        padding: 0.625rem 1rem;
        border: 1px solid var(--nord3);
        border-radius: 0.25rem 0.25rem 0 0;
        background-color: var(--nord2);
        color: var(--nord4);
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .tab-button:hover {
        background-color: var(--nord3);
        color: var(--nord6);
    }

    .tab-button.active {
        background-color: var(--nord1);
        color: var(--nord8);
        border-color: var(--nord8);
        border-bottom-color: var(--nord1);
    }

    .tab-content {
        display: none;
        padding: 1.5rem;
        border: 1px solid var(--nord3);
        border-radius: 0 0.25rem 0.25rem 0.25rem;
        background-color: var(--nord0);
    }

    .tab-content.active {
        display: block;
    }

    .entity-section {
        background-color: var(--nord1);
        border: 1px solid var(--nord3);
        border-radius: 0.25rem;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
    }

    .entity-header {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1.5rem;
    }

    .toggle-checkbox {
        width: 1.25rem;
        height: 1.25rem;
        cursor: pointer;
    }

    .entity-title {
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--nord6);
    }

    .field-mapping-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1rem;
    }

    .field-mapping-table thead {
        background-color: var(--nord2);
    }

    .field-mapping-table th {
        padding: 0.75rem;
        text-align: left;
        font-weight: 600;
        color: var(--nord6);
        font-size: 0.875rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        border-bottom: 1px solid var(--nord3);
        position: relative;
    }

    .field-mapping-table th[title] {
        cursor: help;
        border-bottom: 1px dotted var(--nord8);
    }

    .field-mapping-table tbody tr {
        border-bottom: 1px solid var(--nord3);
    }

    .field-mapping-table tbody tr:hover {
        background-color: var(--nord1);
    }

    .field-mapping-table td {
        padding: 0.75rem;
        color: var(--nord4);
        font-size: 0.875rem;
    }

    .field-input {
        width: 100%;
        padding: 0.375rem 0.5rem;
        border: 1px solid var(--nord3);
        border-radius: 0.25rem;
        background-color: var(--nord0);
        color: var(--nord6);
        font-size: 0.875rem;
    }

    .field-input:focus {
        outline: none;
        border-color: var(--nord8);
    }

    .field-input[style*="border-color: var(--nord11)"] {
        border-color: var(--nord11) !important;
        background-color: rgba(191, 97, 106, 0.1);
    }

    .btn-remove-field {
        padding: 0.375rem 0.75rem;
        border: 1px solid var(--nord11);
        border-radius: 0.25rem;
        background-color: rgba(191, 97, 106, 0.2);
        color: var(--nord11);
        font-size: 0.75rem;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .btn-remove-field:hover {
        background-color: var(--nord11);
        color: var(--nord0);
    }

    .btn-add-field {
        padding: 0.625rem 1rem;
        border: 1px dashed var(--nord8);
        border-radius: 0.25rem;
        background-color: rgba(136, 192, 208, 0.1);
        color: var(--nord8);
        font-size: 0.875rem;
        cursor: pointer;
        transition: all 0.2s ease;
        margin-top: 1rem;
    }

    .btn-add-field:hover {
        background-color: rgba(136, 192, 208, 0.2);
    }

    .btn-action {
        padding: 0.625rem 1.25rem;
        border: 1px solid var(--nord3);
        border-radius: 0.25rem;
        background-color: var(--nord2);
        color: var(--nord6);
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .btn-action:hover {
        background-color: var(--nord3);
        color: var(--nord6);
    }

    .btn-primary {
        padding: 0.625rem 1.5rem;
        border: none;
        border-radius: 0.25rem;
        background-color: var(--nord8);
        color: var(--nord0);
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .btn-primary:hover {
        background-color: var(--nord9);
    }

    .btn-primary:active {
        background-color: var(--nord10);
    }

    .action-buttons {
        display: flex;
        gap: 1rem;
        margin-top: 2rem;
        justify-content: flex-end;
    }

    .status-badge {
        display: inline-block;
        padding: 0.375rem 0.75rem;
        border-radius: 0.25rem;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .status-success {
        background-color: rgba(163, 190, 140, 0.2);
        color: var(--nord14);
    }

    .status-error {
        background-color: rgba(191, 97, 106, 0.2);
        color: var(--nord11);
    }

    .status-pending {
        background-color: rgba(235, 203, 139, 0.2);
        color: var(--nord13);
    }

    .validation-message {
        margin-top: 0.5rem;
        padding: 0.75rem;
        border-radius: 0.25rem;
        font-size: 0.875rem;
    }

    .validation-error {
        background-color: rgba(191, 97, 106, 0.2);
        color: var(--nord11);
        border: 1px solid var(--nord11);
    }

    .validation-success {
        background-color: rgba(163, 190, 140, 0.2);
        color: var(--nord14);
        border: 1px solid var(--nord14);
    }

    .spinner {
        display: inline-block;
        width: 1rem;
        height: 1rem;
        border: 2px solid var(--nord3);
        border-top-color: var(--nord8);
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
    }

    .form-row-full {
        grid-column: 1 / -1;
    }

    @media (max-width: 768px) {
        .form-row {
            grid-template-columns: 1fr;
        }

        .config-container {
            padding: 1rem;
        }

        .tab-buttons {
            gap: 0.25rem;
        }

        .tab-button {
            padding: 0.5rem 0.75rem;
            font-size: 0.75rem;
        }

        .action-buttons {
            flex-direction: column;
        }

        .btn-action,
        .btn-primary {
            width: 100%;
        }
    }
</style>

<!-- Secondary Navigation -->
{{template "secondary-nav" dict "ActiveVA" .ActiveVA "CurrentPage" "datasource" "IsAdmin" .IsAdmin "IsStaff" .IsStaff}}

<!-- Page Header -->
<div class="page-header">
    <h2>Datasource Configuration</h2>
    <p>Configure data synchronization for {{.ActiveVA.VAName}}</p>
</div>

<!-- Config Container with HTMX Load -->
<div class="config-container"
     id="datasource-config-container"
     hx-get="/dashboard/settings/datasource/config"
     hx-trigger="load"
     hx-swap="innerHTML"
     hx-indicator="#global-spinner">
    <!-- Loading state -->
    <div class="flex items-center justify-center p-8" style="color: var(--nord4);">
        <p>Loading configuration...</p>
    </div>
</div>

{{end}}
