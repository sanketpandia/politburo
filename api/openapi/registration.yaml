openapi: "3.0.0"
info:
  title: "Registration & Onboarding API"
  version: "1.0.0"
  description: |
    Bot-facing endpoints covering the pilot registration and VA onboarding flow.
    Consumed by comrade-bot to register pilots, initialise Discord servers as VAs,
    join memberships, and look up user status.

    All endpoints require authentication via three headers sent by the bot.

servers:
  - url: /api/v1

security:
  - ApiKey: []
    ServerId: []
    DiscordId: []

paths:
  /user/register:
    post:
      operationId: registerPilot
      summary: Register a pilot with IFC credentials
      description: |
        Links a Discord account to an Infinite Flight Community (IFC) account.
        Verifies the account exists and the supplied last-flight route matches
        the IFC logbook. Returns a flag indicating whether the server is already
        set up as a VA (so the bot knows whether to prompt the user to /join).
      tags: [registration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPilotRequest"
      responses:
        "201":
          description: Pilot registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterPilotResponse"
        "400":
          description: Missing or invalid fields, or last-flight mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: IFC user not found in Infinite Flight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid X-API-Key authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing required Discord context headers X-Discord-User-Id or X-Discord-Server-Id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: User or IFC ID already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failure (missing required fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "500":
          description: Upstream IFC API or database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /server/init:
    post:
      operationId: initServer
      summary: Bootstrap a Discord server with a VA Code / ID
      description: |
        Creates a minimal VA record linked to the Discord server in X-Discord-Server-Id.
        Requires the calling user to already be registered (/user/register) and
        makes that user the VA admin. Discord collects only the VA Code / ID;
        flight matching setup continues in Vizburo.
      tags: [registration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitServerRequest"
      responses:
        "201":
          description: Server bootstrapped and minimal VA created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitServerResponse"
        "400":
          description: Missing fields or unregistered admin prerequisite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid X-API-Key authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing required Discord context headers X-Discord-User-Id or X-Discord-Server-Id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Discord server already registered as a VA, or VA Code / ID already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failure (missing required fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "500":
          description: Database error during VA creation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /memberships/join:
    post:
      operationId: joinMembership
      summary: Join the VA associated with the current Discord server
      description: |
        Creates a membership record linking the authenticated Discord user to the VA
        resolved from X-Discord-Server-Id. The callsign must exist in the VA's linked Airtable
        base; the bot should surface the Airtable URL in the error message when it
        does not.
      tags: [registration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinMembershipRequest"
      responses:
        "201":
          description: Membership created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinMembershipResponse"
        "400":
          description: Missing callsign, invalid format, or callsign not found in Airtable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid X-API-Key authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing required Discord context headers X-Discord-User-Id or X-Discord-Server-Id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: VA not found for this Discord server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: User is already a member of this VA, or callsign is taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failure (missing required fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "500":
          description: Unexpected database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /user/status:
    get:
      operationId: getUserStatus
      summary: Get authenticated user's registration and membership status
      description: |
        Returns explicit onboarding state for the authenticated Discord user and
        current Discord server. Normal onboarding states, including unregistered
        users and servers that are not configured as VAs, are represented as a
        200 response rather than requiring clients to infer state from 404s.
      tags: [registration]
      responses:
        "200":
          description: User status retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStatusResponse"
        "401":
          description: Missing or invalid X-API-Key authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing required Discord context headers X-Discord-User-Id or X-Discord-Server-Id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pilot/stats:
    get:
      operationId: getCurrentUserPilotStats
      summary: Get current authenticated user's pilot stats
      description: |
        Returns current-user pilot stats for the VA resolved from X-Discord-Server-Id.
        Combines Infinite Flight game stats, configured provider fields, career-mode
        details, and optional insight cards derived from already-fetched data.
      tags: [registration]
      parameters:
        - in: query
          name: refresh
          required: false
          schema:
            type: boolean
          description: Force refresh and bypass profile cache. May be rate-limited by cooldown.
      responses:
        "200":
          description: Pilot stats retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PilotStatsResponse"
        "400":
          description: Missing required claim context or user not eligible for stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid X-API-Key authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing required Discord context headers X-Discord-User-Id or X-Discord-Server-Id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No pilot stats available for the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Refresh cooldown active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server or provider error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /signed-link:
    post:
      operationId: generateSignedLink
      summary: Generate a time-limited signed URL for dashboard access
      description: |
        Produces a presigned URL that, when visited, creates a browser session
        for the authenticated Discord user without a password. The bot posts this
        link so the user can access the Vizburo dashboard from Discord.
        TTL defaults to 15 minutes if omitted; redirect_to defaults to /dashboard.
      tags: [registration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateSignedLinkRequest"
      responses:
        "200":
          description: Signed link generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateSignedLinkResponse"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid X-API-Key authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing required Discord context headers X-Discord-User-Id or X-Discord-Server-Id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User or VA not found for the given Discord IDs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Token generation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /flights/va:
    get:
      operationId: getVALiveFlights
      summary: Get live flights for the current Discord server's VA
      description: |
        Returns the bot-facing live-flight snapshot for the VA resolved from
        X-Discord-Server-Id and the authenticated API key. This operation is
        source-agnostic from the bot's perspective: clients should depend on the
        stable state code, display message, flight list, summary, freshness
        metadata, and optional signed Vizburo live-page link rather than on the
        backend's internal live-data source.

        Missing Discord context headers are expected to be rejected by bot
        context middleware as 403 MISSING_DISCORD_CONTEXT after API-key auth.
      tags: [registration]
      responses:
        "200":
          description: Live flights snapshot retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VALiveFlightsResponse"
        "401":
          description: Missing or invalid X-API-Key authentication
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveFlightsErrorResponse"
        "403":
          description: Missing Discord context, unregistered user, forbidden caller, or VA context not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveFlightsErrorResponse"
        "500":
          description: Live flights cache/source unavailable, stale beyond usable bounds, or signed link generation failure when treated as fatal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveFlightsErrorResponse"

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Bot API key issued per VA
    ServerId:
      type: apiKey
      in: header
      name: X-Discord-Server-Id
      description: Discord server (guild) ID — used to resolve the VA context
    DiscordId:
      type: apiKey
      in: header
      name: X-Discord-User-Id
      description: Discord user ID of the caller

  schemas:
    # ── Shared envelope components ──────────────────────────────────────────

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code (e.g. IFC_USER_NOT_FOUND)
          example: IFC_USER_NOT_FOUND
        message:
          type: string
          description: Human-readable error description
          example: IFC user not found. Please verify your IFC username.

    ValidationFieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: ifc_id
        message:
          type: string
          example: ifc_id is required

    ErrorResponse:
      type: object
      required: [status, responseTimeMs]
      properties:
        status:
          type: string
          enum: [error]
        error:
          $ref: "#/components/schemas/ErrorDetail"
        responseTimeMs:
          type: integer
          format: int64

    ValidationErrorResponse:
      type: object
      required: [status, responseTimeMs]
      properties:
        status:
          type: string
          enum: [error]
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [VALIDATION_FAILED]
            message:
              type: string
            fields:
              type: array
              items:
                $ref: "#/components/schemas/ValidationFieldError"
        responseTimeMs:
          type: integer
          format: int64

    # ── /user/register ──────────────────────────────────────────────────────

    RegisterPilotRequest:
      type: object
      required: [ifc_id, last_flight]
      properties:
        ifc_id:
          type: string
          description: Infinite Flight Community username
          example: john_doe
        last_flight:
          type: string
          description: |
            IATA or ICAO route of the pilot's most recent Infinite Flight flight,
            used to verify ownership of the IFC account (e.g. "KLAX-KSFO").
          example: KLAX-KSFO

    RegisterPilotData:
      type: object
      required: [success, message, is_va_registered]
      properties:
        success:
          type: boolean
        message:
          type: string
          example: Pilot registered successfully
        is_va_registered:
          type: boolean
          description: True when the Discord server is already set up as a VA, indicating the bot may offer VA linking through /register.

    RegisterPilotResponse:
      type: object
      required: [status, responseTimeMs]
      properties:
        status:
          type: string
          enum: [ok]
        result:
          $ref: "#/components/schemas/RegisterPilotData"
        responseTimeMs:
          type: integer
          format: int64

    # ── /server/init ────────────────────────────────────────────────────────

    InitServerRequest:
      type: object
      required: [va_code]
      properties:
        va_code:
          type: string
          description: Short admin-facing VA Code / ID (e.g. "IFE")
          example: IFE

    InitServerData:
      type: object
      required: [success, message, va_code, setup_required]
      properties:
        success:
          type: boolean
        message:
          type: string
          example: Server initialised successfully
        va_code:
          type: string
          example: IFE
        setup_required:
          type: boolean
          description: True when the VA still needs Vizburo setup before flight matching is operational.
          example: true
        dashboard_url:
          type: string
          description: Optional signed dashboard URL, if generated by the backend.
          example: https://viz.example.com/auth/login?token=...
        setup_url:
          type: string
          description: Optional signed setup URL, if generated by the backend.
          example: https://viz.example.com/auth/login?token=...

    InitServerResponse:
      type: object
      required: [status, responseTimeMs]
      properties:
        status:
          type: string
          enum: [ok]
        result:
          $ref: "#/components/schemas/InitServerData"
        responseTimeMs:
          type: integer
          format: int64

    # ── /memberships/join ───────────────────────────────────────────────────

    JoinMembershipRequest:
      type: object
      required: [callsign]
      properties:
        callsign:
          type: string
          description: Pilot's callsign as it appears in the VA's Airtable base
          example: "123"

    JoinMembershipData:
      type: object
      required: [success, message, user_id, va_id, callsign, role]
      properties:
        success:
          type: boolean
        message:
          type: string
          example: Successfully joined the VA
        user_id:
          type: string
          format: uuid
        va_id:
          type: string
          format: uuid
        callsign:
          type: string
          example: "123"
        role:
          type: string
          description: Assigned VA role (e.g. "member", "staff", "admin")
          example: member

    JoinMembershipResponse:
      type: object
      required: [status, responseTimeMs]
      properties:
        status:
          type: string
          enum: [ok]
        result:
          $ref: "#/components/schemas/JoinMembershipData"
        responseTimeMs:
          type: integer
          format: int64

    # ── /user/status ────────────────────────────────────────────────────────

    VAAffiliation:
      type: object
      required: [va_id, va_name, va_code, role, is_active, joined_at]
      properties:
        va_id:
          type: string
          format: uuid
        va_name:
          type: string
          example: Infinite Flight Express
        va_code:
          type: string
          example: IFE
        role:
          type: string
          example: member
        is_active:
          type: boolean
        joined_at:
          type: string
          format: date-time
        callsign:
          type: string
          example: "123"

    CurrentVAStatus:
      type: object
      required: [is_member]
      properties:
        is_member:
          type: boolean
        va_id:
          type: string
          format: uuid
        va_name:
          type: string
          example: Infinite Flight Express
        va_code:
          type: string
          example: IFE
        role:
          type: string
          example: pilot
        is_active:
          type: boolean
        callsign:
          type: string
          example: "123"

    CurrentServerStatus:
      type: object
      required: [discord_server_id, is_configured_va]
      properties:
        discord_server_id:
          type: string
          example: "987654321098765432"
        is_configured_va:
          type: boolean
        va_id:
          type: string
          format: uuid
        va_name:
          type: string
          example: Infinite Flight Express
        va_code:
          type: string
          example: IFE

    MembershipsSummary:
      type: object
      required: [total_count, active_count]
      properties:
        total_count:
          type: integer
          minimum: 0
        active_count:
          type: integer
          minimum: 0

    MembershipSummary:
      type: object
      required: [va_id, va_name, va_code, role, is_active]
      properties:
        va_id:
          type: string
          format: uuid
        va_name:
          type: string
        va_code:
          type: string
        role:
          type: string
        is_active:
          type: boolean

    UserStatusData:
      type: object
      required: [is_registered, global_user_exists, discord_id, is_active, affiliations, current_server, current_va, memberships_summary, other_memberships_count]
      properties:
        is_registered:
          type: boolean
          description: True when a global Comrade Bot account exists for this Discord user.
        global_user_exists:
          type: boolean
          description: Compatibility alias for is_registered.
        user_id:
          type: string
          format: uuid
        discord_id:
          type: string
          example: "123456789012345678"
        if_community_id:
          type: string
          description: IFC username
          example: john_doe
        if_api_id:
          type: string
          description: Infinite Flight Live API user ID, present once the user has flown
          example: abc123
        username:
          type: string
          example: john_doe
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        affiliations:
          type: array
          items:
            $ref: "#/components/schemas/VAAffiliation"
        current_va:
          $ref: "#/components/schemas/CurrentVAStatus"
        current_server:
          $ref: "#/components/schemas/CurrentServerStatus"
        memberships_summary:
          $ref: "#/components/schemas/MembershipsSummary"
        other_memberships_count:
          type: integer
          minimum: 0
        other_memberships:
          type: array
          items:
            $ref: "#/components/schemas/MembershipSummary"

    UserStatusResponse:
      type: object
      required: [status, responseTimeMs]
      properties:
        status:
          type: string
          enum: [ok]
        result:
          $ref: "#/components/schemas/UserStatusData"
        responseTimeMs:
          type: integer
          format: int64

    # ── /pilot/stats ───────────────────────────────────────────────────────

    PilotStatsViolationBreakdown:
      type: object
      required: [level1, level2, level3]
      properties:
        level1:
          type: integer
        level2:
          type: integer
        level3:
          type: integer

    PilotStatsATCProfile:
      type: object
      required: [operations]
      properties:
        operations:
          type: integer
        rank:
          type: integer
          nullable: true

    PilotStatsGameStats:
      type: object
      properties:
        flight_time:
          type: integer
        online_flights:
          type: integer
        landing_count:
          type: integer
        xp:
          type: integer
        grade:
          type: integer
        violations:
          type: integer
        violation_by_level:
          $ref: "#/components/schemas/PilotStatsViolationBreakdown"
        atc:
          $ref: "#/components/schemas/PilotStatsATCProfile"

    PilotStatsProviderData:
      type: object
      properties:
        flight_hours:
          nullable: true
        rank:
          type: string
          nullable: true
        join_date:
          type: string
          nullable: true
        last_activity:
          type: string
          nullable: true
        last_flight:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        total_flights:
          type: integer
          nullable: true
        status:
          type: string
          nullable: true
        additional_fields:
          type: object
          additionalProperties: true

    PilotStatsCareerData:
      type: object
      properties:
        total_cm_hours:
          nullable: true
        required_hours_to_next:
          nullable: true
        last_activity_cm:
          type: string
          nullable: true
        assigned_routes:
          nullable: true
        aircraft:
          type: string
          nullable: true
        airline:
          type: string
          nullable: true
        last_flown_route:
          type: string
          nullable: true
        last_career_mode_pirep:
          nullable: true
        last_career_mode_flight:
          type: string
          nullable: true
        additional_fields:
          type: object
          additionalProperties: true

    PilotStatsRecentPIREP:
      type: object
      required: [at_id, route]
      properties:
        at_id:
          type: string
        route:
          type: string
        flight_mode:
          type: string
        flight_time:
          type: number
          format: float
          nullable: true
        pilot_callsign:
          type: string
        aircraft:
          type: string
        livery:
          type: string
        at_created_time:
          type: string
          nullable: true

    PilotStatsProviderFreshness:
      type: object
      required: [last_fetched_at, cached]
      properties:
        last_fetched_at:
          type: string
          format: date-time
        cached:
          type: boolean
        provider_last_activity:
          type: string
          nullable: true

    PilotStatsRecentFlightCard:
      type: object
      required: [route]
      properties:
        route:
          type: string
        flight_mode:
          type: string
        flight_time:
          type: number
          format: float
          nullable: true
        aircraft:
          type: string
        livery:
          type: string
        occurred_at:
          type: string
          nullable: true

    PilotStatsCareerCard:
      type: object
      properties:
        last_route:
          type: string
          nullable: true
        assigned_route_count:
          type: integer

    PilotStatsInsights:
      type: object
      properties:
        provider_freshness:
          $ref: "#/components/schemas/PilotStatsProviderFreshness"
        recent_flights:
          type: array
          items:
            $ref: "#/components/schemas/PilotStatsRecentFlightCard"
        career:
          $ref: "#/components/schemas/PilotStatsCareerCard"

    PilotStatsMetadata:
      type: object
      required: [provider_configured, last_fetched, cached]
      properties:
        provider_type:
          type: string
        provider_configured:
          type: boolean
        schema_version:
          type: string
        last_fetched:
          type: string
          format: date-time
        cached:
          type: boolean
        va_name:
          type: string

    PilotStatsData:
      type: object
      required: [metadata]
      properties:
        game_stats:
          $ref: "#/components/schemas/PilotStatsGameStats"
        provider_data:
          $ref: "#/components/schemas/PilotStatsProviderData"
        career_mode_data:
          $ref: "#/components/schemas/PilotStatsCareerData"
        recent_pireps:
          type: array
          items:
            $ref: "#/components/schemas/PilotStatsRecentPIREP"
        metadata:
          $ref: "#/components/schemas/PilotStatsMetadata"
        insights:
          $ref: "#/components/schemas/PilotStatsInsights"

    PilotStatsResponse:
      type: object
      required: [status, responseTimeMs]
      properties:
        status:
          type: string
          enum: [ok]
        result:
          $ref: "#/components/schemas/PilotStatsData"
        responseTimeMs:
          type: integer
          format: int64

    # ── /flights/va ────────────────────────────────────────────────────────

    LiveFlightsStateCode:
      type: string
      description: Stable backend-controlled semantic state for the live-flight response.
      enum:
        - LIVE_FLIGHTS_FOUND
        - NO_LIVE_FLIGHTS
        - VA_CONTEXT_NOT_CONFIGURED
        - MISSING_DISCORD_CONTEXT
        - USER_NOT_REGISTERED
        - FORBIDDEN
        - LIVE_FLIGHTS_UNAVAILABLE
        - LIVE_FLIGHTS_STALE
        - SIGNED_LINK_UNAVAILABLE

    LiveFlightPhase:
      type: string
      description: Backend flight-state/phase derived from cached live-flight tracking.
      enum: [on_ground, takeoff, climb, cruise, descent, landed, unknown]

    LiveFlightPhaseHistoryEntry:
      type: object
      required: [ph, at]
      properties:
        ph:
          $ref: "#/components/schemas/LiveFlightPhase"
        at:
          type: string
          format: date-time

    VALiveFlight:
      type: object
      required:
        - flight_id
        - callsign
        - username
        - session_name
        - latitude
        - longitude
        - altitude
        - speed
        - track
        - vertical_speed
        - aircraft_name
        - livery_name
        - phase
        - takeoff_time
        - detected_at
        - last_updated
        - last_report
        - last_flight_plan_fetch
      properties:
        flight_id:
          type: string
          description: Backend live-flight/cache identifier.
        callsign:
          type: string
          description: Pilot callsign detected for the VA.
          example: IFE123
        username:
          type: string
          description: Infinite Flight Community username.
          example: jane_doe
        session_name:
          type: string
          description: Human-readable Infinite Flight server/session name.
          example: Expert Server
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        altitude:
          type: integer
          description: Current altitude in feet.
        speed:
          type: integer
          description: Current ground speed in knots.
        track:
          type: number
          format: double
          description: Current track/heading in degrees.
        vertical_speed:
          type: number
          format: double
          description: Current vertical speed in feet per minute.
        aircraft_name:
          type: string
          description: Display aircraft name resolved by the backend when available.
        livery_name:
          type: string
          description: Display livery name resolved by the backend when available.
        phase:
          $ref: "#/components/schemas/LiveFlightPhase"
        phase_history:
          type: array
          items:
            $ref: "#/components/schemas/LiveFlightPhaseHistoryEntry"
        takeoff_time:
          type: string
          format: date-time
          nullable: true
        landing_time:
          type: string
          format: date-time
          nullable: true
        origin:
          type: string
          description: Origin airport code from the fetched flight plan when available.
          example: KLAX
        destination:
          type: string
          description: Destination airport code from the fetched flight plan when available.
          example: KSFO
        route:
          type: string
          description: Optional backend display route, typically origin-destination when both are known.
          example: KLAX-KSFO
        max_speed:
          type: integer
          nullable: true
          description: Maximum recorded speed in knots from cached waypoints, if any.
        max_altitude:
          type: integer
          nullable: true
          description: Maximum recorded altitude in feet from cached waypoints, if any.
        detected_at:
          type: string
          format: date-time
        last_updated:
          type: string
          format: date-time
        last_report:
          type: string
          format: date-time
        last_flight_plan_fetch:
          type: string
          format: date-time
          nullable: true

    LiveFlightsTopRoute:
      type: object
      description: Most common route in the current result; only included when a route has count greater than 1.
      required: [route, count]
      properties:
        route:
          type: string
          example: KLAX-KSFO
        count:
          type: integer
          minimum: 2
          example: 3

    LiveFlightsSummary:
      type: object
      required: [total_detected_flights]
      properties:
        total_detected_flights:
          type: integer
          minimum: 0
          description: Count of flights detected for the VA in this response.
        top_route:
          $ref: "#/components/schemas/LiveFlightsTopRoute"

    LiveFlightsFreshness:
      type: object
      properties:
        generated_at:
          type: string
          format: date-time
          description: Time the backend generated this live-flight snapshot.
        newest_report_at:
          type: string
          format: date-time
          nullable: true
          description: Most recent pilot report timestamp across returned flights, if any.
        oldest_report_at:
          type: string
          format: date-time
          nullable: true
          description: Oldest pilot report timestamp across returned flights, if any.
        is_stale:
          type: boolean
          description: True when the backend considers the snapshot stale but still usable.
        stale_after_seconds:
          type: integer
          minimum: 0
          description: Backend freshness threshold used to classify staleness, when exposed.

    VALiveFlightsData:
      type: object
      required: [code, message, flights, summary]
      properties:
        code:
          $ref: "#/components/schemas/LiveFlightsStateCode"
        message:
          type: string
          description: Bot-safe display message for the current live-flight state.
          example: Live flights fetched
        flights:
          type: array
          items:
            $ref: "#/components/schemas/VALiveFlight"
        summary:
          $ref: "#/components/schemas/LiveFlightsSummary"
        freshness:
          $ref: "#/components/schemas/LiveFlightsFreshness"
        signed_link:
          type: string
          description: Optional signed URL to the Vizburo live page for the current user/VA.
          example: https://dashboard.example.com/auth/login?token=eyJ...

    VALiveFlightsResponse:
      type: object
      required: [status, responseTimeMs]
      properties:
        status:
          type: string
          enum: [ok]
        result:
          $ref: "#/components/schemas/VALiveFlightsData"
        responseTimeMs:
          type: integer
          format: int64

    LiveFlightsErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/LiveFlightsStateCode"
        message:
          type: string
          description: Bot-safe error message.

    LiveFlightsErrorResponse:
      type: object
      required: [status, error, responseTimeMs]
      properties:
        status:
          type: string
          enum: [error]
        error:
          $ref: "#/components/schemas/LiveFlightsErrorDetail"
        responseTimeMs:
          type: integer
          format: int64

    # ── /signed-link ────────────────────────────────────────────────────────

    GenerateSignedLinkRequest:
      type: object
      properties:
        redirect_to:
          type: string
          description: Path to redirect the user to after login. Defaults to /dashboard.
          example: /dashboard
        ttl_minutes:
          type: integer
          description: Link validity in minutes. Defaults to 15.
          minimum: 1
          maximum: 1440
          example: 15

    GenerateSignedLinkData:
      type: object
      required: [url, expires_in, redirect_to]
      properties:
        url:
          type: string
          description: Full presigned URL the user should visit to authenticate
          example: https://dashboard.example.com/auth/login?token=eyJ...
        expires_in:
          type: integer
          description: Seconds until the link expires
          example: 900
        redirect_to:
          type: string
          example: /dashboard

    GenerateSignedLinkResponse:
      type: object
      required: [status, responseTimeMs]
      properties:
        status:
          type: string
          enum: [ok]
        result:
          $ref: "#/components/schemas/GenerateSignedLinkData"
        responseTimeMs:
          type: integer
          format: int64
