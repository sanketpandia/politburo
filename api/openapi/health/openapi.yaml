openapi: 3.0.3
info:
  title: Politburo Operational API
  version: 0.1.0
  description: Liveness and readiness endpoints for the clean-slate application.
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Report whether the process is alive
      responses:
        "200":
          description: The process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Report whether required dependencies are ready
      responses:
        "200":
          description: The application is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: A required dependency is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
components:
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
        started_at:
          type: string
          format: date-time
        uptime:
          type: string
        services:
          type: object
          additionalProperties:
            type: string

