{{define "content"}}
<style>
    /* Use style guidelines colors */
    :root {
        --bg-app: #0f111a;
        --bg-surface: #161925;
        --border-subtle: rgba(30, 41, 59, 0.6);
        --text-primary: #f1f5f9;
        --text-secondary: #cbd5e1;
        --text-muted: #64748b;
        --accent-primary: #3b82f6;
        --status-cruise: #3b82f6;
        --status-climb: #10b981;
        --status-landing: #f59e0b;
        --status-descent: #a855f7;
    }

    .secondary-nav {
        display: flex;
        gap: 1rem;
        margin-bottom: 2rem;
        border-bottom: 2px solid var(--border-subtle);
        flex-wrap: wrap;
    }

    .secondary-nav-item {
        padding: 0.75rem 1.5rem;
        font-size: 0.95rem;
        font-weight: 500;
        color: var(--text-secondary);
        text-decoration: none;
        cursor: pointer;
        border-bottom: 3px solid transparent;
        transition: all 0.2s ease;
        white-space: nowrap;
    }

    .secondary-nav-item:hover {
        color: var(--text-primary);
        border-bottom-color: var(--accent-primary);
    }

    .secondary-nav-item.active {
        color: var(--accent-primary);
        border-bottom-color: var(--accent-primary);
    }

    .live-flights-container {
        background-color: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: 0.5rem;
        padding: 1.5rem;
        height: calc(100vh - 300px);
        min-height: 600px;
        display: flex;
        flex-direction: column;
    }

    .live-flights-header {
        margin-bottom: 1.5rem;
    }

    .live-flights-title {
        color: var(--text-primary);
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
    }

    .live-flights-subtitle {
        color: var(--text-muted);
        font-size: 0.875rem;
    }

    #gleo-map-wrapper {
        width: 100%;
        height: 100%;
        flex: 1;
        display: flex;
        flex-direction: column;
        position: relative;
        border-radius: 0.5rem;
        overflow: hidden;
        background-color: var(--bg-app);
    }

    #gleo-map {
        width: 100%;
        flex: 1;
        display: block;
        position: relative;
        min-height: 400px;
    }

    /* Loading state */
    .loading-state {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: var(--text-muted);
    }

    .spinner {
        display: inline-block;
        width: 1.5rem;
        height: 1.5rem;
        border: 2px solid var(--border-subtle);
        border-top-color: var(--accent-primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-right: 0.75rem;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    /* Responsive design */
    @media (max-width: 640px) {
        .live-flights-container {
            height: calc(100vh - 250px);
            min-height: 400px;
            padding: 1rem;
        }

        .secondary-nav {
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .secondary-nav-item {
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
        }
    }
</style>

<!-- Secondary Navigation -->
{{template "secondary-nav" dict "ActiveVA" .ActiveVA "CurrentPage" "live" "MenuItems" .MenuItems}}

<!-- Live Flights Content -->
<div class="live-flights-container">
    <div class="live-flights-header">
        <h2 class="live-flights-title">Live Flights</h2>
        <p class="live-flights-subtitle">Real-time tracking of active flights for {{.ActiveVA.VAName}}</p>
    </div>

    <!-- Map Container -->
    <div id="gleo-map-wrapper">
        <div id="gleo-map">
            <div class="loading-state">
                <div class="spinner"></div>
                <span>Loading map...</span>
            </div>
        </div>
    </div>
</div>

<script>
  // Load Gleo library and initialize empty map
  async function initializeMap() {
    try {
      // Wait for map container to be visible and have dimensions
      const mapContainer = document.getElementById('gleo-map');
      const maxRetries = 50;
      let retries = 0;

      while ((!mapContainer.offsetWidth || !mapContainer.offsetHeight) && retries < maxRetries) {
        await new Promise(resolve => setTimeout(resolve, 10));
        retries++;
      }

      if (!mapContainer.offsetWidth || !mapContainer.offsetHeight) {
        console.warn('Map container has no dimensions after waiting');
      }

      const gleoBase = "/static/js/gleo/";
      const { default: MercatorMap } = await import(gleoBase + "MercatorMap.mjs");
      const { default: MercatorTiles } = await import(gleoBase + "loaders/MercatorTiles.mjs");

      // Initialize map with world view (default center and span)
      const map = new MercatorMap("gleo-map", {
        center: [0, 0], // Center of world
        span: 10000000, // Default to world view (~10,000 km)
        maxSpan: 14e6,
      });

      // Add OSM tiles
      new MercatorTiles("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap contributors"
      }).addTo(map);

      // Clear loading state
      mapContainer.innerHTML = '';

    } catch (error) {
      console.error("Error rendering live flights map:", error);
      console.error("Stack trace:", error.stack);
      const mapContainer = document.getElementById('gleo-map');
      mapContainer.innerHTML =
        '<div class="loading-state" style="color: #ef4444;"><span>Error loading map: ' + error.message + '</span></div>';
    }
  }

  // Initialize map when script loads
  // Use a small delay to ensure DOM is fully settled
  setTimeout(() => {
    initializeMap();
  }, 50);
</script>
{{end}}
