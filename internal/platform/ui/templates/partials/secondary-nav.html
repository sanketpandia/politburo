{{define "secondary-nav"}}
<!-- Secondary Navigation - Feature-Driven Component
     Parameters:
       - ActiveVA: The active virtual airline membership
       - CurrentPage: String indicating active page
       - MenuItems: Array of menu items (from platformui.GetMenuItems)
-->
<nav class="secondary-nav">
    {{range .MenuItems}}
    <a href="{{.Path}}" 
       class="secondary-nav-item {{if eq $.CurrentPage .PageID}}active{{end}}"
       data-page-id="{{.PageID}}">
        {{if .Icon}}
        <span class="nav-icon nav-icon-{{.Icon}}"></span>
        {{end}}
        <span>{{.Label}}</span>
    </a>
    {{end}}
</nav>
{{end}}
